*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#354d73;--azul-escuro:#22344f;--azul-claro:#e7ecf4;
  --verde:#42ce02;--verde-claro:#e9f9df;--laranja:#f34b06;--laranja-claro:#fdece4;
  --roxo:#8010ff;--roxo-claro:#f1e7ff;--amarelo:#f3ce02;--amarelo-claro:#fdf7d6;
  --fundo:#f4f6fa;--papel:#fff;--linha:#d9dfe9;--texto:#1c2a40;--texto-2:#56627a;--texto-3:#8a94a8;
  --display:'Pressio MEC','Pressio No. 45','Barlow Condensed','Arial Narrow',sans-serif;
  --corpo:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
body{font-family:var(--corpo);background:var(--fundo);color:var(--texto);line-height:1.5;font-size:15.5px}
.topo{background:var(--azul);color:#fff;padding:26px 22px 0}
.topo-in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.marca{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.85}
.marca .l1{font-size:22px;color:rgba(255,255,255,.75);letter-spacing:.02em}
.marca .l2{font-size:clamp(52px,10vw,96px)}
.selo{font-family:var(--display);font-size:20px;padding:8px 14px;border:2px solid var(--verde);color:#fff}
.selo.interno{background:var(--laranja);border-color:var(--laranja)}
.faixa{height:8px;display:flex;margin-top:22px}.faixa span{flex:1}
.aviso-interno{background:var(--laranja);color:#fff;text-align:center;font-weight:600;padding:8px 16px;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:0 18px 70px}
section{padding-top:44px}
h2{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,48px);line-height:.9;color:var(--azul);text-transform:uppercase;display:flex;align-items:baseline;gap:12px}
h2 .n{color:var(--verde)}
.sub{color:var(--texto-2);margin:8px 0 18px;max-width:70ch}
h3{font-family:var(--display);font-weight:800;font-size:24px;color:var(--azul);margin:26px 0 10px;line-height:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2px;background:var(--linha);border:2px solid var(--linha)}
.card{background:var(--papel);padding:14px 16px;border-top:6px solid var(--c,var(--azul))}
.card .v{font-family:var(--display);font-weight:900;font-size:46px;line-height:1;color:var(--azul)}
.card .r{font-size:13.5px;font-weight:600;margin-top:4px}
.card .d{font-size:12.5px;color:var(--texto-2);margin-top:2px}
.pendente{background:var(--amarelo-claro);border:2px dashed var(--amarelo);padding:16px 18px;font-size:15px}
.pendente b{display:block;font-family:var(--display);font-size:22px;color:var(--azul);margin-bottom:4px}
.tab-wrap{overflow-x:auto;background:var(--papel);border:1px solid var(--linha)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--linha);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:var(--azul-claro);color:var(--texto-2);font-size:12.5px;font-weight:600}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;background:#fafbfd}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.painel{background:var(--papel);border:1px solid var(--linha);padding:14px 16px}
.painel h4{font-size:13px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.barra{display:grid;grid-template-columns:minmax(120px,52%) 1fr 30px;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.barra .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .b{height:12px;background:var(--azul-claro)}
.barra .b i{display:block;height:100%;background:var(--c,var(--azul))}
.barra .n{text-align:right;font-weight:600}
.pilha{display:flex;height:26px;margin:4px 0 6px}
.pilha span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--texto-2)}
.leg i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--roxo-claro);color:#5a0bb8;font-size:13px;padding:3px 9px}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px;background:var(--linha);border:2px solid var(--linha)}
.dest article{background:var(--papel);padding:14px 16px}
.dest .dt{font-size:12.5px;font-weight:700;color:var(--laranja);text-transform:uppercase}
.dest h5{font-family:var(--display);font-size:22px;line-height:1.05;color:var(--azul);margin:4px 0 6px;font-weight:800}
.dest p{font-size:14px;color:var(--texto-2)}
.ind{display:flex;gap:4px;margin-top:8px}.ind span{font-size:11.5px;font-weight:700;background:var(--verde-claro);color:#236b00;padding:1px 7px}
.interno-box{background:var(--laranja-claro);border-left:6px solid var(--laranja);padding:14px 16px}
.interno-box ul{padding-left:20px;display:grid;gap:6px;font-size:14.5px}
.nota{font-size:13px;color:var(--texto-2);margin-top:8px}
footer{background:var(--azul);color:rgba(255,255,255,.8);font-size:13px;padding:22px;text-align:center}
@media print{.topo{padding-top:12px}section{break-inside:avoid-page}}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca"><div class="l1">Meninas em Campo · Fechamento do mês</div><div class="l2" id="t-mes"></div></div>
    <div class="selo" id="selo"></div>
  </div>
  <div class="faixa"><span style="background:var(--verde)"></span><span style="background:var(--amarelo)"></span><span style="background:var(--laranja)"></span><span style="background:var(--roxo)"></span></div>
</header>
<div id="aviso"></div>
<main id="main"></main>

function card(v, r, d, c){ return `<div class="card" style="--c:${c||'var(--azul)'}"><div class="v">${v}</div><div class="r">${r}</div>${d?`<div class="d">${d}</div>`:''}</div>`; }
function barras(lista, cor, max){
  if (!lista || !lista.length) return '<p class="nota">Sem registros no mês.</p>';
  const m = max || Math.max(...lista.map(x=>x[1]));
  return lista.map(([t,n]) => `<div class="barra" style="--c:${cor}"><span class="t" title="${esc(t)}">${esc(t)}</span><span class="b"><i style="width:${n/m*100}%"></i></span><span class="n">${n}</span></div>`).join('');
}
function pilha(obj, ordem, cores){
  const tot = ordem.reduce((s,k)=>s+(obj[k]||0),0);
  if (!tot) return '<p class="nota">Sem registros.</p>';
  return `<div class="pilha">${ordem.map((k,i)=>obj[k]?`<span style="flex:${obj[k]};background:${cores[i]}">${pct(obj[k],tot)}</span>`:'').join('')}</div>
    <div class="leg">${ordem.map((k,i)=>`<span><i style="background:${cores[i]}"></i>${esc(k)} (${obj[k]||0})</span>`).join('')}</div>`;
}

}

   ${card(E.ano.entradas,'Entradas no ano',`base de ${E.ano.base} em fevereiro`,'var(--verde)')}
  </div>
  <div class="tab-wrap" style="margin-top:14px"><table><thead><tr><th>Turma</th><th>Início do mês</th><th>Entradas</th><th>Saídas</th><th>Mudança de turma</th><th>Fim do mês</th><th>Evasão do mês</th><th>Saídas no ano</th><th>Entradas no ano</th><th>Evasão no ano</th></tr></thead><tbody>
  ${prog.map(t=>`<tr><td>${esc(t.nome)}</td><td>${t.inicio}</td><td>${t.entradas}</td><td>${t.saidas}</td><td>${t.transf>0?'+':''}${t.transf}</td><td>${t.fim}</td><td style="${t.taxa>=10?'color:var(--laranja);font-weight:700':''}">${f1(t.taxa)}%</td><td>${t.saidas_ano}</td><td>${t.entradas_ano}</td><td>${f1(t.taxa_ano)}%</td></tr>`).join('')}
  </tbody><tfoot><tr><td>Programa (Sub-11 ao Sub-17)</td><td>${atual.inicio}</td><td>${atual.entradas}</td><td>${atual.saidas}</td><td>${sm('transf')>0?'+':''}${sm('transf')}</td><td>${atual.fim}</td><td>${f1(atual.taxa)}%</td><td>${E.ano.saidas}</td><td>${E.ano.entradas}</td><td>${f1(E.ano.taxa)}%</td></tr>
  ${pt?`<tr><td>Primeiro Tempo (BASF)</td><td>${pt.inicio}</td><td>${pt.entradas}</td><td>${pt.saidas}</td><td>${pt.transf>0?'+':''}${pt.transf}</td><td>${pt.fim}</td><td>${f1(pt.taxa)}%</td><td>${pt.saidas_ano}</td><td>${pt.entradas_ano}</td><td>${f1(pt.taxa_ano)}%</td></tr>`:''}</tfoot></table></div>
  <div class="grade" style="margin-top:14px">
   <div class="painel"><h4>Saídas por mês (programa)</h4>${barras(S.map(s=>[MESES[s.mes-1],s.saidas]),'var(--laranja)')}</div>
   <div class="painel"><h4>Entradas por mês (programa)</h4>${barras(S.map(s=>[MESES[s.mes-1],s.entradas]),'var(--verde)')}</div>
  </div>
  <p class="nota">Evasão no ano = saídas desde fevereiro ÷ (atletas em fevereiro + entradas no ano).</p>`;
}
h += `</section>`;

/* 3. TURMAS — EDUCADORAS */
h += `<section><h2><span class="n">3</span>Treinos — Sub-11 ao Sub-17</h2>
<p class="sub">Formulário Diário de Atividades preenchido pelas educadoras. ${T.geral.treinos} treinos em ${mesNome.toLowerCase()} (${mesAnt.toLowerCase()}: ${T.anterior.treinos}).</p>
${tabela(T.turmas, T.geral)}
<div class="grade" style="margin-top:14px">
 <div class="painel"><h4>Percepção de esforço da turma</h4>${barras(['1','2','3','4','5'].map(k=>['Nível '+k, T.geral.esforco_dist[k]||0]),'var(--azul)')}</div>
 <div class="painel"><h4>Motivos de ausência mais citados</h4>${barras(T.ausencias,'var(--laranja)')}</div>
 <div class="painel"><h4>Fundamentos trabalhados</h4>${barras(T.fundamentos,'var(--verde)')}</div>
 <div class="painel"><h4>Métodos de ensino</h4>${barras(T.metodos,'var(--azul)')}</div>
 <div class="painel"><h4>Psicologia — temas trabalhados</h4>${barras(T.psico_temas,'var(--roxo)')}</div>
 <div class="painel"><h4>Temas transversais</h4>${T.temas_lista.length ? `<div class="tags">${T.temas_lista.map(x=>`<span>${esc(x)}</span>`).join('')}</div>` : '<p class="nota">Nenhum tema transversal registrado no mês.</p>'}</div>
</div></section>`;

/* 4. CATEGORIA DE BASE */
const cE = ['var(--verde)','var(--amarelo)','var(--laranja)'];
h += `<section><h2><span class="n">4</span>Categoria de Base</h2>
<p class="sub">Formulário pós-treino da comissão técnica (Sub-13, Sub-15 e Sub-17 Treinamento). ${B.geral.treinos} treinos em ${mesNome.toLowerCase()} (${mesAnt.toLowerCase()}: ${B.anterior.treinos}).</p>
${tabela(B.turmas, B.geral)}
<div class="grade" style="margin-top:14px">
 <div class="painel"><h4>Engajamento das atletas</h4>${pilha(B.geral.engajamento,['Muito alto','Médio','Muito Baixo'],cE)}</div>
 <div class="painel"><h4>Execução em relação ao planejado</h4>${pilha(B.geral.execucao,['Totalmente coerente','Parcialmente coerente','Distante do planejado'],cE)}</div>
 <div class="painel"><h4>Envolvimento da comissão técnica</h4>${pilha(B.geral.comissao,['Envolvimento altamente qualificado','Envolvimento adequado','Pouco envolvimento'],cE)}</div>
 <div class="painel"><h4>Conteúdos técnicos</h4>${barras(B.fundamentos,'var(--verde)')}</div>
 <div class="painel"><h4>Motivos de ausência</h4>${barras(B.ausencias,'var(--laranja)')}</div>
 <div class="painel"><h4>Temas transversais e atividades</h4>${B.temas_lista.length ? `<div class="tags">${B.temas_lista.map(x=>`<span>${esc(x)}</span>`).join('')}</div>` : '<p class="nota">Nenhum registro.</p>'}</div>
</div>
<div class="grade" style="margin-top:14px">${B.turmas.map(t=>`<div class="painel"><h4>${esc(t.nome)} — engajamento</h4>${pilha(t.engajamento,['Muito alto','Médio','Muito Baixo'],cE)}</div>`).join('')}</div>
</section>`;

/* 5. DESTAQUES */
h += `<section><h2><span class="n">5</span>Destaques do mês</h2>
<p class="sub">Atividades registradas no Descritivo, com os indicadores de impacto relacionados.</p>
<div class="dest">${DADOS.destaques.map(x=>`<article><div class="dt">${esc(x.data)}</div><h5>${esc(x.titulo)}</h5><p>${esc(x.texto)}</p><div class="ind">${x.ind.map(i=>`<span>${i}</span>`).join('')}</div></article>`).join('')}</div>
<p class="nota">IBP Bem-estar e Pertencimento · IPF Protagonismo Feminino · IDES Desenvolvimento Esportivo · IES Engajamento e Retenção · IEF Engajamento Familiar · IBI Bem-estar Integral</p>
</section>`;

/* 6. INTERNO */
if (!PUBLICO) {
  const regs = [...(T.interno?.saidas||[]).map(x=>['Saída · Sub-11 ao Sub-17',x]), ...(B.interno?.saidas||[]).map(x=>['Saída · Categoria de Base',x]),
                ...(T.interno?.observacoes||[]).map(x=>['Observação · Sub-11 ao Sub-17',x]), ...(B.interno?.observacoes||[]).map(x=>['Observação · Categoria de Base',x])];
  h += `<section><h2><span class="n">6</span>Para acompanhamento</h2>
  <p class="sub">Registros das equipes, atletas abaixo de 75% e movimentação. Levar à reunião de casos críticos (Fase 3).</p>
  <div class="interno-box">${regs.length ? `<ul>${regs.map(([k,v])=>`<li><b>${k}:</b> ${esc(v)}</li>`).join('')}</ul>` : 'Nenhum registro textual no mês.'}</div>
  ${F && F.interno ? `<h3>Atletas ativas abaixo de 75%</h3><div class="tab-wrap"><table><thead><tr><th>Atleta</th><th>Turma</th><th>Frequência oficial</th><th>P</th><th>A</th><th>AJ</th></tr></thead><tbody>
  ${F.interno.alertas.map(a=>`<tr><td>${esc(a.nome)}</td><td>${esc(a.turma)}</td><td style="color:var(--laranja);font-weight:700">${f1(a.freq)}%</td><td>${a.P}</td><td>${a.A}</td><td>${a.AJ}</td></tr>`).join('')}</tbody></table></div>
  <h3>Movimentação do mês</h3><div class="tab-wrap"><table><thead><tr><th>Atleta</th><th>Turma</th><th>Tipo</th></tr></thead><tbody>
  ${(DADOS.evasao&&DADOS.evasao.interno?DADOS.evasao.interno.movimentacao:F.interno.movimentacao).map(m=>`<tr><td>${esc(m.nome)}</td><td>${esc(m.turma)}</td><td>${m.tipo}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </section>`;
}

document.getElementById('main').innerHTML = h;
document.getElementById('rodape').innerHTML = `Meninas em Campo · Fechamento de ${mesNome} ${DADOS.ano}<br>Fontes: formulários das educadoras e da Categoria de Base${F?', lista de presença TOTVS':''} e Descritivo 2026.${PUBLICO?' Versão pública com dados agregados, sem nomes.':''}`;
</script>
</body>
