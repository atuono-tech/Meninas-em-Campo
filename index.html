<!DOCTYPE html>
<!-- capa v3 -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meninas em Campo · Publicações</title>
<style>
@font-face{font-family:"Pressio";src:url("Pressio_No__45_Black_Condensed.otf") format("opentype");font-weight:900}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#354d73;--azul-2:#2b3f5f;--amarelo:#f3ce02;--laranja:#f34b06;--verde:#42ce02;--roxo:#8010ff;
  --fundo:#f1eee8;--papel:#fff;--linha:#e3e0d8;--texto:#22344f;--texto-2:#5b6780;
  --display:"Pressio","Arial Narrow",sans-serif;--corpo:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{font-family:var(--corpo);background:var(--fundo);color:var(--texto);min-height:100vh}
a{color:inherit}
.topo{background:var(--amarelo);border-bottom:6px solid var(--azul);padding:22px 28px}
.topo-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.logo{height:74px;width:auto;display:block}
.topo-dir{text-align:right}
.topo-dir .big{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,64px);line-height:.9;color:var(--azul);text-transform:uppercase}
.menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.menu a{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--azul);text-decoration:none;border:2px solid var(--azul);border-radius:8px;padding:6px 12px;background:rgba(255,255,255,.35)}
.menu a:hover{background:var(--azul);color:var(--amarelo)}
main{max-width:1100px;margin:0 auto;padding:30px 18px 50px}
.anos{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:760px){.anos{grid-template-columns:1fr}.topo-dir{text-align:left}.menu{justify-content:flex-start}}
.ano{background:var(--papel);border:3px solid var(--azul);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ano-cab{background:var(--azul);overflow:hidden;padding:18px 24px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;position:relative}
.ano-cab::after{content:"";position:absolute;right:-24px;bottom:-4px;width:220px;height:124px;background:url("icones/sol_branco.png") no-repeat center bottom/contain;opacity:.16;pointer-events:none}
.ano-cab h2,.ano-cab span{position:relative;z-index:1}
.ano-cab h2{font-family:var(--display);font-weight:900;font-size:68px;line-height:.9;color:var(--amarelo);letter-spacing:.02em}
.ano-cab span{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c9d3e3}
.itens{list-style:none;display:flex;flex-direction:column}
.itens li+li{border-top:1px solid var(--linha)}
.item{display:flex;align-items:center;gap:14px;padding:16px 22px;text-decoration:none;color:var(--azul);transition:background .15s}
a.item:hover{background:#f7f5f0}
.item .ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.item .ic{width:30px;height:30px;background:transparent!important}
.item .ic img{width:100%;height:100%;object-fit:contain}
.item.off .ic img{filter:grayscale(1);opacity:.35}
.item .tx{flex:1;min-width:0}
.item .nm{display:block;font-family:var(--display);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase}
.item .ds{display:block;font-size:13px;color:var(--texto-2);margin-top:3px}
.item .seta{font-size:22px;font-weight:800;opacity:.35;transition:opacity .15s,transform .15s}
a.item:hover .seta{opacity:1;transform:translateX(3px)}
.item.off{color:#a6adbb;cursor:default}.item.off .ic{filter:grayscale(1);opacity:.5}.item.off .ds{color:#a6adbb}
.c1{background:#e6ecf5}.c2{background:#e3f7d6}.c3{background:#efe4ff}.c4{background:#fde9e1}.c5{background:#fdf6d3}
.rodape{background:var(--azul);color:#c9d3e3;margin-top:10px;padding:26px 18px 30px}
.rodape-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.rodape .csc{height:96px;width:96px;background:#fff;border-radius:50%;padding:4px}
.rodape p{font-size:13px;line-height:1.6;flex:1;min-width:240px}
.rodape .maos{height:44px;width:44px}
.rodape p b{color:#fff;font-size:15px}
.rodape a{color:var(--amarelo)}

</style>
</head>
<body>
<header class="topo"><div class="topo-in">
  <a href="index.html"><img class="logo" src="logo_MeC_10anos.png" alt="Meninas em Campo · 10 anos"></a>
  <div class="topo-dir">
    <div class="big">Publicações</div>
    <nav class="menu" aria-label="Seções">
      <a href="fechamentos.html">Fechamentos</a>
      <a href="fotos.html">Fotos</a>
      <a href="#paineis" data-ir="paineis">Painéis</a>
      <a href="#prestacao" data-ir="prestacao">Prestação de Contas</a>
    </nav>
  </div>
</div></header>

<main>
  <div class="anos" id="anos"></div>
</main>
<footer class="rodape">
  <div class="rodape-in">
    <img class="maos" src="icones/maos_rodape.png" alt="" onerror="this.remove()">
    <img class="csc" src="logo_CSC.png" alt="Congregação de Santa Cruz" onerror="this.style.display='none'">
    <p><b>O Meninas em Campo é um programa social da Congregação de Santa Cruz.</b><br>
    Relatórios, painéis e prestação de contas · dados agregados, sem nomes de atletas</p>
  </div>
</footer>

<script>
/* ===== CONFIG: um bloco por ano. Para incluir um item novo, edite só aqui. url vazia = ainda não publicado ===== */
var ANOS = [
  { ano:"2026", sub:"Em andamento", itens:[
    {id:"fechamentos", nome:"Fechamentos mensais", desc:"Frequência, evasão e treinos de cada mês", c:"c1", url:"fechamentos.html"},
    {id:"fotos",       nome:"Fotos",               desc:"Registros das atividades", c:"c5", url:"fotos.html"},
    {id:"atividades",  nome:"Atividades realizadas", desc:"Descritivo das ações mês a mês", c:"c2", url:"Atividades em 2026.html"},
    {id:"paineis",     nome:"Painel de impacto",   desc:"Autoavaliação, metas da LIE e permanência", c:"c4", url:"Painel de Impacto 2026.html"},
    {id:"prestacao",   nome:"Prestação de contas", desc:"LIE Ciclo 2 · execução orçamentária", c:"c3", url:"Lei de Incentivo ao Esporte _Ciclo 2.html"}
  ]},
  { ano:"2025", sub:"Ano concluído", itens:[
    {id:"fechamentos", nome:"Fechamentos mensais", desc:"Não publicados neste site", c:"c1", url:""},
    {id:"fotos",       nome:"Fotos",               desc:"Não publicadas neste site", c:"c5", url:""},
    {id:"atividades",  nome:"Atividades realizadas", desc:"Livro de atividades 2025", c:"c2", url:"Atividades em 2025.html"},
    {id:"paineis",     nome:"Painel de impacto",   desc:"Relatório de impacto social 2025", c:"c4", url:"Impacto em 2025.html"},
    {id:"prestacao",   nome:"Prestação de contas", desc:"LIE Ciclo 1 · prestação de contas final", c:"c3", url:"Lei de Incentivo ao Esporte _Ciclo1.html"}
  ]}
];
function enc(u){return u.split("/").map(encodeURIComponent).join("/");}
document.getElementById("anos").innerHTML = ANOS.map(function(a){
  return '<section class="ano" id="ano-'+a.ano+'"><div class="ano-cab"><h2>'+a.ano+'</h2><span>'+a.sub+'</span></div><ul class="itens">'+
    a.itens.map(function(it){
      var corpo='<span class="ic '+it.c+'"><img src="icones/'+it.id+'.png" alt="" onerror="this.remove()"></span><span class="tx"><span class="nm">'+it.nome+'</span><span class="ds">'+it.desc+'</span></span>';
      return '<li id="'+it.id+'-'+a.ano+'">'+(it.url?'<a class="item" href="'+enc(it.url)+'">'+corpo+'<span class="seta">→</span></a>':'<div class="item off">'+corpo+'</div>')+'</li>';
    }).join("")+'</ul></section>';
}).join("");
/* Menu: Painéis e Prestação de Contas destacam os itens nos dois anos */
document.querySelectorAll('[data-ir]').forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();
  var id=l.dataset.ir, els=document.querySelectorAll('[id^="'+id+'-"]');
  els.forEach(function(x){x.animate([{background:'#fdf6d3'},{background:'transparent'}],{duration:1600});});
  if(els[0]) els[0].scrollIntoView({behavior:'smooth',block:'center'});});});
</script>
</body>
</html>
