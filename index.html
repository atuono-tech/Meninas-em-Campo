<!DOCTYPE html>
<!-- v2 -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meninas em Campo · Publicações</title>
<style>
@font-face {
  font-family:"Pressio";
  src:url("Pressio_No__45_Black_Condensed.otf") format("opentype");
  font-weight:900
}
:root{
  --verde:#42ce02; --amarelo:#f3ce02; --laranja:#f44c06;
  --roxo:#c084fc;  --azul:#354d73;   --branco:#EEEEEE;
  --cinza-card:rgba(255,255,255,.04);
  --borda:rgba(255,255,255,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:"Arial Narrow",Arial,sans-serif;
  background:var(--azul); color:var(--branco);
  min-height:100vh; overflow-x:hidden;
}
/* grid sutil de fundo */
body::after{
  content:""; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none; z-index:0;
}

/* ── HEADER ── */
header{
  position:relative; z-index:10;
  max-width:1100px; margin:0 auto;
  padding:2.5rem 2.5rem 0;
}
.logo-bar{
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:2px solid var(--verde);
  padding-bottom:1rem; margin-bottom:1.25rem;
  flex-wrap:wrap; gap:.75rem;
}
.logo-img{
  height:76px; width:auto; object-fit:contain;
  
}
.header-right{display:flex;flex-direction:column;align-items:stretch;gap:.4rem;}
.badge{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.89rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--amarelo); padding:.35rem .85rem;
  border:1.5px solid var(--amarelo); border-radius:2px;
  width:100%; text-align:center; white-space:nowrap;
  box-sizing:border-box;
}
.subtitle{
  font-size:1.58rem; color:rgba(238,238,238,.90);
  letter-spacing:.02em; text-align:center;
}

/* ── SEARCH ── */
.search-wrap{
  position:relative; z-index:10;
  max-width:1100px; margin:0 auto;
  padding:.75rem 2.5rem 1.5rem;
}
.search-row{display:flex;gap:.6rem;position:relative;}
.search-icon{
  position:absolute;left:.85rem;top:50%;
  transform:translateY(-50%);
  color:rgba(238,238,238,.3);pointer-events:none;
}
.search-input{
  flex:1;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:2px;
  padding:.65rem 1rem .65rem 2.75rem;
  color:var(--branco);
  font-family:"Arial Narrow",Arial,sans-serif;
  font-size:1.62rem; outline:none;
  transition:border-color .2s;
}
.search-input::placeholder{color:rgba(238,238,238,.42);}
.search-input:focus{border-color:var(--verde);}
.search-count{
  font-size:1.48rem;color:rgba(238,238,238,.75);
  align-self:center;white-space:nowrap;
}

/* ── MAIN GRID ── */
.main{
  position:relative;z-index:10;
  max-width:1100px;margin:0 auto;
  padding:0 2.5rem 5rem;
  display:flex;flex-direction:column;gap:2.75rem;
}

/* ── YEAR BLOCK ── */
.year-block{}
.year-header{
  display:flex;align-items:center;gap:.75rem;
  margin-bottom:1rem;
}
.year-pill{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:4.14rem;letter-spacing:.1em;
  padding:.25rem .85rem;
  border-radius:2px;
  white-space:nowrap;
}
.year-pill.y2025{
  background:#EEEEEE;
  border:1.5px solid #EEEEEE;
  color:var(--azul);
}
.year-pill.y2026{
  background:#EEEEEE;
  border:1.5px solid #EEEEEE;
  color:var(--azul);
}
.year-line{flex:1;height:1px;background:rgba(255,255,255,.08);}
.year-count{font-size:1.4rem;color:rgba(238,238,238,.75);white-space:nowrap;}

/* ── 2 colunas ── */
.cols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.07);
}
@media(max-width:640px){.cols{grid-template-columns:1fr;}}

/* ── SEÇÃO DE TURMAS ── */
.turmas-section{
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.07);
  margin-top:1px;
}
.turmas-header{
  padding:1rem 1.25rem;
  background:rgba(0,0,0,.15);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:.75rem;
}
.turmas-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:rgba(255,255,255,.04);
}
@media(max-width:640px){.turmas-grid{grid-template-columns:repeat(2,1fr);}}

/* ── CHIP (card compacto de turma) ── */
.chip{
  display:flex;flex-direction:column;gap:.3rem;
  padding:1rem 1.25rem;
  background:rgba(255,255,255,.02);
  text-decoration:none;color:inherit;
  position:relative;overflow:hidden;
  transition:background .15s;
  min-height:90px;
  justify-content:center;
}
.chip::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--chip-accent,var(--verde));
  transition:width .18s;
}
.chip:hover{background:rgba(255,255,255,.06);}
.chip:hover::before{width:5px;}
.chip-cat{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.17rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--chip-accent,var(--verde));
}
.chip-label{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.98rem;font-weight:900;text-transform:uppercase;
  color:var(--branco);line-height:1.1;
}

/* ── FECHAMENTOS MENSAIS: meses lado a lado ── */
.meses-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:rgba(255,255,255,.04);
}
@media(max-width:900px){.meses-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.meses-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.meses-grid{grid-template-columns:1fr;}}
.mes-card{background:rgba(255,255,255,.02);display:flex;flex-direction:column;min-width:0}
.mes-nome{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.17rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(238,238,238,.75);padding:.85rem 1.25rem .35rem;
}
.mes-card .chip{min-height:72px;padding:.6rem 1.25rem 1rem;background:none}
.mes-card .chip + .chip{border-top:1px solid rgba(255,255,255,.06)}
.mes-card .chip-label{font-size:1.6rem}

/* ── SEÇÃO FOTOS ── */
.fotos-section{
  border:1px solid rgba(255,255,255,.07);
  border-top:none;
  background:rgba(255,255,255,.02);
}
.fotos-header{
  padding:.85rem 1.25rem;
  background:rgba(0,0,0,.10);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:.75rem;
}
.fotos-icon{
  font-size:1.8rem;color:rgba(238,238,238,.5);
}
.fotos-title{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.8rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--branco);
}
.fotos-sub{
  font-size:1.4rem;color:rgba(238,238,238,.55);margin-left:auto;
}
.fotos-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:rgba(255,255,255,.04);
}
@media(max-width:640px){.fotos-grid{grid-template-columns:repeat(2,1fr);}}
.foto-mes{
  padding:.85rem 1rem;
  background:rgba(255,255,255,.02);
  display:flex;flex-direction:column;gap:.5rem;
}
.foto-mes-nome{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.62rem;font-weight:900;text-transform:uppercase;
  color:var(--branco);letter-spacing:.05em;
}
.foto-links{
  display:flex;flex-direction:column;gap:4px;
}
.foto-link{
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:1.3rem;letter-spacing:.04em;
  color:var(--amarelo);text-decoration:none;
  border:1px solid rgba(243,206,2,.3);
  border-radius:2px;padding:.25rem .6rem;
  transition:background .15s,border-color .15s;
  width:fit-content;
}
.foto-link:hover{background:rgba(243,206,2,.12);border-color:rgba(243,206,2,.6);}
.foto-link svg{flex-shrink:0;opacity:.7;}


.col-header{
  padding:1.25rem 1.25rem;
  background:rgba(0,0,0,.15);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:.75rem;
}
.col-pill{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.98rem;letter-spacing:.2em;text-transform:uppercase;
  padding:.3rem .8rem;border-radius:2px;
}
.col-pill.pc{
  background:rgba(243,206,2,.15);color:var(--amarelo);
  border:1px solid rgba(243,206,2,.3);
}
.col-pill.op{
  background:rgba(255,255,255,.06);color:rgba(238,238,238,.80);
  border:1px solid rgba(255,255,255,.22);
}
.col-title{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:3.96rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--branco);
}
.col-desc{
  font-size:1.53rem;color:rgba(238,238,238,.75);
  margin-left:auto;
}

/* ── CARDS ── */
.cards{display:flex;flex-direction:column;gap:0;}

.card{
  position:relative;
  background:var(--cinza-card);
  padding:1.25rem 1.25rem 1rem;
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:.35rem;
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .15s;
  overflow:hidden;
  min-height:110px;
}
.card:last-child{border-bottom:none;}
.card::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--accent,var(--verde));
  transition:width .18s;
}
.card:hover{background:rgba(255,255,255,.055);}
.card:hover::before{width:5px;}

.card-cat{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:1.4rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent,var(--verde));font-weight:500;
}
.card-title{
  font-family:"Pressio","Arial Narrow",Arial,sans-serif;
  font-size:2.52rem;font-weight:900;
  text-transform:uppercase;line-height:1.06;
  color:var(--branco);
}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:.6rem;
  border-top:1px solid rgba(255,255,255,.06);
}
.card-file{
  font-size:1.35rem;color:rgba(238,238,238,.60);
  font-family:"Courier New",monospace;
  word-break:break-all;
}
.card-arrow{
  color:var(--accent,var(--verde));
  opacity:0;transform:translateX(-4px);
  transition:opacity .15s,transform .15s;
  font-size:1.8rem;flex-shrink:0;margin-left:.5rem;
}
.card:hover .card-arrow{opacity:1;transform:translateX(0);}

/* ── EMPTY / LOADING ── */
.empty{
  padding:2rem 1.25rem;
  font-size:1.44rem;font-style:italic;
  color:rgba(238,238,238,.2);
  border-bottom:none;
  min-height:80px;display:flex;align-items:center;
}
.loading-block{
  padding:3rem;text-align:center;
  color:rgba(238,238,238,.3);font-size:1.53rem;
}
.spinner{
  width:24px;height:24px;
  border:2px solid rgba(66,206,2,.18);
  border-top-color:var(--verde);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto .75rem;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── LEGEND ── */
.legend{
  display:flex;gap:1.25rem;flex-wrap:wrap;
  padding:.6rem 1.25rem;
  background:rgba(0,0,0,.1);
  border-top:1px solid rgba(255,255,255,.06);
}
.legend-item{display:flex;align-items:center;gap:.4rem;font-size:1.35rem;color:rgba(238,238,238,.80);}
.legend-dot{width:8px;height:8px;border-radius:50%;}

/* ── FOOTER ── */
footer{
  position:relative;z-index:10;
  max-width:1100px;margin:0 auto;
  padding:1.25rem 2.5rem 2.5rem;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:.75rem;
  border-top:1px solid rgba(255,255,255,.07);
  font-size:1.26rem;color:rgba(238,238,238,.25);
}
footer a{color:var(--verde);text-decoration:none;}
footer a:hover{text-decoration:underline;}
.dots{display:flex;gap:5px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{animation:fadeUp .35s ease both;}

@media(max-width:560px){
  header,.search-wrap,.main,footer{padding-left:1rem;padding-right:1rem;}
  .logo-img{height:56px;}
  .card-title{font-size:1.98rem;}
}
/* ===== TEMA MEC (padrão dos fechamentos) — sobrepõe o visual escuro antigo ===== */
:root{--fundo:#f1eee8;--papel:#fff;--linha:#e3e0d8;--texto:#22344f;--texto-2:#5b6780;--branco:#22344f;--cinza-card:#fff;--roxo:#8010ff}
body{background:var(--fundo)!important;color:var(--texto)!important;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif!important}
body::after{display:none!important}
.topo{background:#f3ce02;border-bottom:6px solid #354d73;padding:22px 28px;position:relative;z-index:10}
.topo-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.topo .logo{font-family:"Pressio","Pressio MEC","Arial Narrow",sans-serif;font-weight:900;font-size:34px;line-height:.82;color:#354d73;text-transform:uppercase;text-decoration:none}
.topo-dir{text-align:right}
.topo-dir .big{font-family:"Pressio","Pressio MEC","Arial Narrow",sans-serif;font-weight:900;font-size:clamp(40px,7vw,64px);line-height:.9;color:#354d73;text-transform:uppercase}
.topo-dir .lbl{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:#2b3f5f;text-transform:uppercase;opacity:.85}
.search-wrap{padding-top:1.6rem!important}
.search-input{background:#fff!important;border:2px solid #354d73!important;border-radius:10px!important;color:var(--texto)!important;font-family:inherit!important;font-size:15px!important}
.search-input::placeholder{color:#8a93a6!important}
.search-icon{color:#354d73!important;opacity:.6}
.search-count,.year-count{color:var(--texto-2)!important;font-size:13px!important}
.year-pill.y2025,.year-pill.y2026{background:#354d73!important;border-color:#354d73!important;color:#f3ce02!important;border-radius:8px!important}
.year-line{background:var(--linha)!important;height:2px!important}
.cols,.turmas-section,.fotos-section{background:transparent!important;border:none!important;gap:16px!important}
.cols>*,.turmas-section,.fotos-section{background:#fff;border:2px solid #354d73!important;border-radius:12px;overflow:hidden}
.turmas-section,.fotos-section{margin-top:16px!important}
.col-header,.turmas-header,.fotos-header{background:#fff!important;border-bottom:3px solid #f3ce02!important}
.col-title,.fotos-title{color:#354d73!important}
.col-desc,.fotos-sub,.mes-nome{color:var(--texto-2)!important}
.col-pill.pc{background:#fdf6d3!important;color:#5f5000!important;border-color:#f3ce02!important}
.col-pill.op{background:#e6ecf5!important;color:#354d73!important;border-color:#354d73!important}
.card,.chip,.foto-mes,.mes-card{background:#fff!important}
.card{border-bottom:1px solid var(--linha)!important}
.card:hover,.chip:hover{background:#f7f5f0!important}
.card-title,.chip-label,.foto-mes-nome{color:#354d73!important}
.card-file{color:var(--texto-2)!important}
.card-foot{border-top:1px solid var(--linha)!important}
.meses-grid,.turmas-grid,.fotos-grid{background:var(--linha)!important}
.mes-card .chip + .chip{border-top:1px solid var(--linha)!important}
.foto-link{color:#354d73!important;border-color:#354d73!important;font-weight:700}
.foto-link:hover{background:#e6ecf5!important}
.legend{background:#fbfaf7!important;border-top:1px solid var(--linha)!important}
.legend-item{color:var(--texto-2)!important}
.empty,.loading-block{color:var(--texto-2)!important}
footer{border-top:1px solid var(--linha)!important;color:#a09a8e!important}
footer a{color:#354d73!important}
header.topo{max-width:none!important;margin:0!important;padding:22px 28px!important}
.col{background:#fff;border:2px solid #354d73;border-radius:12px;overflow:hidden;margin-top:16px}
.card-cat,.chip-cat{color:color-mix(in srgb,var(--accent,var(--chip-accent,#42ce02)) 65%,#22344f)!important}
.mes-card .chip-cat,.turmas-grid .chip-cat{color:color-mix(in srgb,var(--chip-accent,#42ce02) 65%,#22344f)!important}
.legend{border-radius:10px;margin-top:16px}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="topo"><div class="topo-in">
  <div class="logo">Meninas<br>em Campo</div>
  <div class="topo-dir"><div class="big">Publicações</div><div class="lbl">Relatórios, fechamentos e prestação de contas · 2025–2026</div></div>
</div></header>

<!-- ── SEARCH ── -->
<div class="search-wrap">
  <div class="search-row">
    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" id="q" type="search"
           placeholder="Buscar documento…" autocomplete="off"/>
    <span class="search-count" id="total-count"></span>
  </div>
</div>

<!-- ── MAIN ── -->
<div class="main" id="main">
  <div class="loading-block">
    <div class="spinner"></div>
    Buscando arquivos no repositório…
  </div>
</div>

<!-- ── FOOTER ── -->
<footer>
  <a href="https://github.com/atuono-tech/mec_dashboards_2025" target="_blank">
    github.com/atuono-tech/mec_dashboards_2025
  </a>
  <div class="dots">
    <div class="dot" style="background:#42ce02"></div>
    <div class="dot" style="background:#f44c06"></div>
    <div class="dot" style="background:#c084fc"></div>
    <div class="dot" style="background:#f3ce02"></div>
    <div class="dot" style="background:#354d73;border:1px solid rgba(255,255,255,.2)"></div>
  </div>
</footer>

<script>
/* ─────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────── */
var REPO  = "atuono-tech/Meninas-em-Campo";
var BASE  = "https://atuono-tech.github.io/Meninas-em-Campo/";
var API   = "https://api.github.com/repos/" + REPO + "/contents/";

/* ─────────────────────────────────────────────
   CLASSIFICAÇÃO
   Retorna { year, col, accent, cat, label }
───────────────────────────────────────────── */
function classify(name) {
  var n = name.toLowerCase();

  /* ANO */
  var year = "2026";
  if (n.indexOf("2025") >= 0) year = "2025";
  else if (n.indexOf("ciclo1") >= 0 || n.indexOf("ciclo 1") >= 0 || n.indexOf("_ciclo1") >= 0) year = "2025";
  else if (n.indexOf("ciclo2") >= 0 || n.indexOf("ciclo 2") >= 0 || n.indexOf("_ciclo 2") >= 0) year = "2026";

  /* COLUNA: "pc" (prestação de contas) ou "op" (operacional) */
  var isPC =
    n.indexOf("lie") >= 0 ||
    n.indexOf("lei de incentivo") >= 0 ||
    n.indexOf("ciclo") >= 0 ||
    n.indexOf("prestacao") >= 0 ||
    n.indexOf("prestação") >= 0 ||
    n.indexOf("execucao") >= 0 ||
    n.indexOf("fomento") >= 0 ||
    n.indexOf("orcamento") >= 0;

  /* COR DE DESTAQUE */
  var accent = "#42ce02"; // verde (padrão operacional)
  if (isPC) {
    accent = "#f3ce02"; // amarelo = PC
  } else if (n.indexOf("impacto") >= 0 || n.indexOf("relatorio") >= 0 || n.indexOf("relatório") >= 0) {
    accent = "#f44c06"; // laranja = relatório de impacto
  } else if (n.indexOf("atividade") >= 0 || n.indexOf("descri") >= 0) {
    accent = "#c084fc"; // roxo claro = atividades (contraste adequado sobre azul)
  } else if (n.indexOf("dashboard") >= 0 || n.indexOf("sub") >= 0 || n.indexOf("primeiro") >= 0) {
    accent = "#42ce02"; // verde = dashboard operacional
  }

  /* RÓTULO DE CATEGORIA */
  var cat = "Documento";
  if (isPC) {
    if (n.indexOf("ciclo 2") >= 0 || n.indexOf("ciclo2") >= 0 || n.indexOf("_ciclo 2") >= 0) cat = "LIE · Ciclo 2";
    else if (n.indexOf("ciclo1") >= 0 || n.indexOf("ciclo 1") >= 0 || n.indexOf("_ciclo1") >= 0) cat = "LIE · Ciclo 1";
    else if (n.indexOf("lie") >= 0 || n.indexOf("lei de incentivo") >= 0) cat = "LIE";
    else cat = "Prestação de Contas";
  } else if (n.indexOf("impacto") >= 0) {
    cat = "Relatório de Impacto";
  } else if (n.indexOf("atividade") >= 0 || n.indexOf("descri") >= 0) {
    cat = "Descrição de Atividades";
  } else if (n.indexOf("primeiro") >= 0 && n.indexOf("tempo") >= 0) {
    cat = "Programa Primeiro Tempo";
  } else if (n.indexOf("dashboard") >= 0) {
    cat = "Dashboard";
  }

  return { year:year, col:isPC?"pc":"op", accent:accent, cat:cat };
}

/* ─────────────────────────────────────────────
   TÍTULO LEGÍVEL
───────────────────────────────────────────── */
function prettify(name) {
  return name
    .replace(/\.html$/i, "")
    .replace(/[-_]/g, " ")
    .replace(/(\w)/g, function(c){ return c.toUpperCase(); })
    .trim();
}

/* ─────────────────────────────────────────────
   ESTADO
───────────────────────────────────────────── */
var allFiles = [];
var q = "";

/* ─────────────────────────────────────────────
   RENDER
───────────────────────────────────────────── */
function makeCard(f, idx) {
  var info = classify(f.name);
  var url  = BASE + encodeURIComponent(f.name);
  var delay = (idx * 0.045) + "s";
  return (
    '<a class="card" href="' + url + '"' +
    ' style="--accent:' + info.accent + ';animation-delay:' + delay + '">' +
      '<div class="card-cat">' + info.cat + '</div>' +
      '<div class="card-title">' + prettify(f.name) + '</div>' +
      '<div class="card-foot">' +
        '<span class="card-file">' + f.name + '</span>' +
        '<span class="card-arrow">→</span>' +
      '</div>' +
    '</a>'
  );
}

function makeChip(f, idx) {
  var info = classify(f.name);
  var url  = BASE + encodeURIComponent(f.name);
  var delay = (idx * 0.045) + "s";
  return (
    '<a class="chip" href="' + url + '"' +
    ' style="--chip-accent:' + info.accent + ';animation-delay:' + delay + '">' +
      '<div class="chip-cat">' + info.cat + '</div>' +
      '<div class="chip-label">' + prettify(f.name) + '</div>' +
    '</a>'
  );
}

/* Coluna institucional (PC ou OP sem turmas) */
function makeCol(files, colKey, yearKey, idx0) {
  var filtered = files.filter(function(f){
    var info = classify(f.name);
    return info.col === colKey && info.year === yearKey && !isTurma(f.name, yearKey);
  });

  var isPc = colKey === "pc";
  var colTitle = isPc ? "Prestação de Contas - LIE" : "Relatorio de Atividades e Impacto";
  var pillCls  = isPc ? "pc" : "op";
  var colDesc  = isPc ? "LIE · Captação" : "Institucional";
  var innerHtml = filtered.length
    ? '<div class="cards">' + filtered.map(function(f, i){ return makeCard(f, idx0 + i); }).join("") + '</div>'
    : '<div class="empty card" style="animation:none">Nenhum arquivo nesta categoria.</div>';

  return (
    '<div class="col">' +
      '<div class="col-header">' +
        '<span class="col-title">' + colTitle + '</span>' +
        '<span class="col-desc">' + colDesc + '</span>' +
      '</div>' +
      innerHtml +
    '</div>'
  );
}

/* Seção de turmas (só aparece em 2026 com dashboards de turma) */
function isTurma(name, yearKey) {
  if (yearKey !== "2026") return false;
  var n = name.toLowerCase();
  return (n.indexOf("sub") >= 0 || (n.indexOf("primeiro") >= 0 && n.indexOf("tempo") >= 0));
}

function makeTurmasSection(files, yearKey, idx0) {
  return ""; /* seção removida: continha nomes das alunas */
  var turmas = files.filter(function(f){ return isTurma(f.name, yearKey); });
  if (!turmas.length) return "";

  return (
    '<div class="turmas-section">' +
      '<div class="turmas-header">' +
        '<span class="col-title">Acompanhamento Mensal das Turmas</span>' +
        '<span class="col-desc">' + turmas.length + ' turma' + (turmas.length !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<div class="turmas-grid">' +
        turmas.map(function(f, i){ return makeChip(f, idx0 + i); }).join("") +
      '</div>' +
    '</div>'
  );
}

function render() {
  var lq = q.toLowerCase();
  var filtered = allFiles.filter(function(f){
    return !lq
      || f.name.toLowerCase().indexOf(lq) >= 0
      || prettify(f.name).toLowerCase().indexOf(lq) >= 0;
  });

  document.getElementById("total-count").textContent =
    filtered.length + " arquivo" + (filtered.length !== 1 ? "s" : "");

  var years = ["2026","2025"].filter(function(yr){
    return filtered.some(function(f){ return classify(f.name).year === yr; });
  });

  if (!filtered.length) {
    document.getElementById("main").innerHTML =
      '<div class="loading-block">Nenhum documento encontrado para "<em>' + q + '</em>".</div>';
    return;
  }

  var html = "";
  var globalIdx = 0;

  years.forEach(function(yr){
    var yFiles  = filtered.filter(function(f){ return classify(f.name).year === yr; });
    var yCls    = yr === "2025" ? "y2025" : "y2026";
    var yCount  = yFiles.length + " arquivo" + (yFiles.length !== 1 ? "s" : "");
   var turmaCount = yFiles.filter(function(f){ return isTurma(f.name, yr); }).length;
   var opCount    = yFiles.filter(function(f){ return classify(f.name).col === "op" && !isTurma(f.name, yr); }).length;
   var pcCount    = yFiles.filter(function(f){ return classify(f.name).col === "pc" && !isTurma(f.name, yr); }).length;
    html +=
      '<div class="year-block">' +
        '<div class="year-header">' +
          '<span class="year-pill ' + yCls + '">' + yr + '</span>' +
          '<div class="year-line"></div>' +
          '<span class="year-count">' + yCount + '</span>' +
        '</div>' +
makeMesesSection(yr) +
           makeTurmasSection(yFiles, yr, globalIdx) +
           makeFotosSection(yr) +
           makeCol(yFiles, "op", yr, globalIdx + turmaCount) +
           makeCol(yFiles, "pc", yr, globalIdx + turmaCount + opCount) +
      '</div>';

    globalIdx += yFiles.length;
  });

  html +=
    '<div class="legend">' +
      '<div class="legend-item"><div class="legend-dot" style="background:#f3ce02"></div>Prestação de Contas / LIE</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#f44c06"></div>Relatório de Impacto</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:#c084fc"></div>Atividades</div>' +
    '</div>';

  document.getElementById("main").innerHTML = html;
}

function makeFotosSection(yearKey) {
  if (yearKey !== "2026") return "";

  return (
    '<div class="fotos-section">' +
      '<div class="fotos-header">' +
        '<span class="fotos-title">Fotos &amp; Vídeos · 2026</span>' +
      '</div>' +
      '<div class="foto-mes" style="grid-column:1/-1;padding:1rem 1.25rem;">' +
        '<a class="foto-link" href="fotos.html" style="font-size:2.59rem;">Ver todas as fotos 2026 →</a>' +
      '</div>' +
    '</div>'
  );
}


/* ─────────────────────────────────────────────
   LEITURA AUTOMÁTICA DO REPOSITÓRIO
   Qualquer .html (ou .pdf) que você subir aparece sozinho.
   - Arquivos na raiz: seções por tipo (como antes)
   - Arquivos dentro de pastas de mês (ex.: "SET 26"): seção "Fechamentos mensais"
───────────────────────────────────────────── */
var BRANCH = "main";
var TREE_API = "https://api.github.com/repos/" + REPO + "/git/trees/" + BRANCH + "?recursive=1";

/* Arquivos que NÃO devem aparecer na página (nomes exatos, com pasta se houver) */
var IGNORAR = ["index.html", "central.html", "fotos.html", "404.html", "assinatura_MeC_10anos_horizontal.html"];

/* Lista de reserva: usada só se o GitHub não responder (limite de acessos). */
var REPO_FILES = [
  "Atividades em 2025.html",
  "Atividades em 2026.html",
  "Impacto em 2025.html",
  "Lei de Incentivo ao Esporte _Ciclo 2.html",
  "Lei de Incentivo ao Esporte _Ciclo1.html",
  "Memoria_do_Mes_2026.html"
];

var MESES_ABR = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
var MESES_NOME = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var monthFiles = [];

/* "JUNHO 26", "SET 26", "Março 2026" → {m:6, y:"2026"} */
function lerPastaMes(pasta) {
  var s = pasta.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  var m = -1;
  for (var i = 0; i < 12; i++) { if (s.indexOf(MESES_ABR[i]) === 0) { m = i + 1; break; } }
  if (m < 0) return null;
  var ano = (s.match(/(\d{2,4})\s*$/) || [])[1];
  if (!ano) return null;
  if (ano.length === 2) ano = "20" + ano;
  return { m: m, y: ano };
}

function urlDe(path) {
  return BASE + path.split("/").map(encodeURIComponent).join("/");
}

function usarLista(paths) {
  var raiz = [], meses = [];
  paths.forEach(function(p){
    if (!/\.(html|pdf)$/i.test(p)) return;
    if (IGNORAR.indexOf(p) >= 0) return;
    var partes = p.split("/");
    if (partes.length === 1) {
      if (/\.html$/i.test(p)) raiz.push({ name: p });
    } else if (partes.length === 2) {
      var mes = lerPastaMes(partes[0]);
      if (mes) meses.push({ name: partes[1], path: p, pasta: partes[0], m: mes.m, y: mes.y });
    }
  });
  allFiles = raiz.sort(function(a,b){ return a.name.localeCompare(b.name); });
  monthFiles = meses.sort(function(a,b){ return (b.y + pad(b.m)).localeCompare(a.y + pad(a.m)) || a.name.localeCompare(b.name); });
  render();
}
function pad(n){ return (n < 10 ? "0" : "") + n; }

function load() {
  var CACHE = "mec_publicacoes_tree";
  try {
    var c = JSON.parse(sessionStorage.getItem(CACHE) || "null");
    if (c && Date.now() - c.t < 5 * 60 * 1000) { usarLista(c.paths); return; }
  } catch (e) {}
  fetch(TREE_API)
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      var paths = (d.tree || []).filter(function(x){ return x.type === "blob"; }).map(function(x){ return x.path; });
      try { sessionStorage.setItem(CACHE, JSON.stringify({ t: Date.now(), paths: paths })); } catch (e) {}
      usarLista(paths);
    })
    .catch(function(){ usarLista(REPO_FILES); });
}

/* Seção "Fechamentos mensais" (arquivos dentro das pastas de mês) */
function makeMesesSection(yearKey) {
  var lq = q.toLowerCase();
  var files = monthFiles.filter(function(f){
    return f.y === yearKey && (!lq || f.name.toLowerCase().indexOf(lq) >= 0 || f.pasta.toLowerCase().indexOf(lq) >= 0);
  });
  if (!files.length) return "";
  var grupos = [];
  files.forEach(function(f){
    var g = grupos[grupos.length - 1];
    if (!g || g.m !== f.m) { g = { m: f.m, itens: [] }; grupos.push(g); }
    g.itens.push(f);
  });
  return (
    '<div class="turmas-section">' +
      '<div class="turmas-header">' +
        '<span class="col-title">Fechamentos mensais</span>' +
        '<span class="col-desc">' + grupos.length + (grupos.length !== 1 ? ' meses' : ' mês') + '</span>' +
      '</div>' +
      '<div class="meses-grid">' +
      grupos.map(function(g){
        return '<div class="mes-card">' +
                 '<div class="mes-nome">' + MESES_NOME[g.m - 1] + ' ' + yearKey + '</div>' +
                 g.itens.map(function(f, i){
                   var info = classify(f.name);
                   return '<a class="chip" href="' + urlDe(f.path) + '" style="--chip-accent:' + info.accent + ';animation-delay:' + (i * 0.045) + 's">' +
                            '<div class="chip-cat">' + (/\.pdf$/i.test(f.name) ? 'PDF' : info.cat) + '</div>' +
                            '<div class="chip-label">' + prettify(f.name.replace(/\.pdf$/i, "")) + '</div>' +
                          '</a>';
                 }).join("") +
               '</div>';
      }).join("") +
      '</div>' +
    '</div>'
  );
}

/* ─────────────────────────────────────────────
   EVENTOS
───────────────────────────────────────────── */
document.getElementById("q").addEventListener("input", function(e){
  q = e.target.value;
  render();
});

load();
</script>
</body>
</html>
