*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#354d73;--azul-2:#2b3f5f;--amarelo:#f3ce02;--laranja:#f34b06;--verde:#42ce02;--roxo:#8010ff;
  --fundo:#f1eee8;--papel:#fff;--linha:#e3e0d8;--texto:#22344f;--texto-2:#5b6780;--cinza:#d9d4ca;
  --display:'Pressio MEC','Pressio No. 45','Barlow Condensed','Arial Narrow',sans-serif;--corpo:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{font-family:var(--corpo);background:var(--fundo);color:var(--texto);font-size:15px;line-height:1.45}
.topo{background:var(--amarelo);border-bottom:6px solid var(--azul);padding:22px 28px}
.topo-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:900;font-size:34px;line-height:.82;color:var(--azul);text-transform:uppercase}
.topo-dir{text-align:right}
.topo-dir .big{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,64px);line-height:.9;color:var(--azul);text-transform:uppercase}
.topo-dir .lbl{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--azul-2);text-transform:uppercase;opacity:.85}
.aviso{background:var(--laranja);color:#fff;text-align:center;font-weight:700;font-size:13.5px;padding:7px 12px;letter-spacing:.02em}
main{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
.abas{display:flex;flex-wrap:wrap;border:2px solid var(--azul);border-radius:10px;overflow:hidden;background:#fff;margin-bottom:22px}
.abas button{flex:1 1 auto;font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--azul);background:#fff;border:none;border-right:1px solid var(--linha);padding:13px 14px;cursor:pointer;white-space:nowrap}
.abas button:last-child{border-right:none}
.abas button[aria-selected="true"]{background:var(--azul);color:var(--amarelo)}
.aba[hidden]{display:none}
.pill{display:inline-block;background:var(--amarelo);color:var(--azul);font-weight:800;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:6px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--azul);border-radius:10px;padding:14px 12px;text-align:center;color:#fff}
.kpi .l{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amarelo)}
.kpi .v{font-family:var(--display);font-weight:900;font-size:44px;line-height:1.05;margin:4px 0 2px}
.kpi .d{font-size:12px;color:#c9d3e3}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin-bottom:16px}
@media (max-width:520px){.grade{grid-template-columns:1fr}}
.box{background:var(--papel);border:2px solid var(--azul);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.grade .box{margin-bottom:0}
.box h4{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);padding-bottom:8px;border-bottom:3px solid var(--amarelo);margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 56px;align-items:center;gap:10px;font-size:12.5px;margin-bottom:7px}
.bar .t{text-align:right;text-transform:uppercase;color:var(--azul);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{height:13px;background:#ecebe6;border-radius:3px;overflow:hidden}
.bar .b i{display:block;height:100%;border-radius:3px}
.bar .n{font-weight:800;color:var(--azul)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--texto-2);margin-top:6px}
.leg i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.pilha{display:flex;height:28px;border-radius:5px;overflow:hidden}
.pilha span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;min-width:0;overflow:hidden}
.ind{width:100%;border-collapse:collapse;font-size:14px}
.ind td{padding:7px 2px;border-bottom:1px solid var(--linha)}
.ind td:last-child{text-align:right;font-weight:800;font-size:15.5px}
.nota{border-radius:6px;padding:10px 14px;font-size:13.5px;margin-top:10px;border-left:5px solid}
.nota.az{background:#e6ecf5;border-color:var(--azul);color:var(--azul)}
.nota.am{background:#fdf6d3;border-color:var(--amarelo);color:#5f5000}
.nota.la{background:#fde9e1;border-color:var(--laranja);color:#8a2a00}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-2);text-align:right;padding:7px 8px;border-bottom:2px solid var(--amarelo);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--linha);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tfoot td{font-weight:800}
.baixo{color:var(--laranja);font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#fdf6d3;color:var(--azul);font-size:13px;padding:4px 10px;border-radius:4px}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dest .box h5{font-family:var(--display);font-size:22px;line-height:1.05;margin:4px 0 6px;font-weight:800}
.dest .dt{font-size:12px;font-weight:800;color:var(--laranja);text-transform:uppercase;letter-spacing:.05em}
.dest p{font-size:13.5px;color:var(--texto-2)}
.chips{display:flex;gap:4px;margin-top:8px}.chips span{font-size:11px;font-weight:800;background:var(--azul);color:var(--amarelo);padding:2px 7px;border-radius:3px}
.pend{background:#fdf6d3;border:2px dashed var(--amarelo);border-radius:10px;padding:14px 16px}
.sub{color:var(--texto-2);font-size:13.5px;margin:-6px 0 14px}
footer{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a09a8e;padding:20px}
@media print{.abas{display:none}.aba[hidden]{display:block}.aba{break-before:page}}
</style>
</head>

  <div class="logo">Meninas<br>em Campo</div>
  <div class="topo-dir"><div class="big" id="big"></div><div class="lbl" id="lbl"></div></div>
</div></header>
<div id="aviso"></div>
<main><nav class="abas" role="tablist" id="abas"></nav><div id="conteudo"></div></main>

function barras(lista,{max,cor,fmt}={}){
  if(!lista||!lista.length) return '<p class="sub" style="margin:0">Sem registros no mês.</p>';
  const m=max||Math.max(...lista.map(x=>x[1]||0))||1;
  return lista.map(([t,n,txt],i)=>`<div class="bar"><span class="t" title="${esc(t)}">${esc(t)}</span><span class="b"><i style="width:${(n||0)/m*100}%;background:${typeof cor==='function'?cor(n,i):(cor||AZ)}"></i></span><span class="n">${txt!=null?txt:(fmt?fmt(n):n)}</span></div>`).join('');

  return `<div class="pilha">${ordem.map((k,i)=>obj[k]?`<span style="flex:${obj[k]};background:${cores[i]}">${pct(obj[k],tot)}</span>`:'').join('')}</div>

function cartaoTurma(t, comNotas){
  const fo=t.form, fr=t.freq, ev=t.ev;

  if(fr){ rows.push(['Frequência oficial',`<span class="${fr.oficial<75?'baixo':''}">${f1(fr.oficial)}%</span>`]); rows.push(['Atletas ativas',fr.ativas]); rows.push(['Abaixo de 75%',fr.alertas]); }
  if(ev){ rows.push(['Evasão do mês',`${f1(ev.taxa)}% (${ev.saidas} saída${ev.saidas!==1?'s':''})`]); rows.push(['Entradas',ev.entradas]); }

          rows.push(['Sessões psicologia',`${fo.psicologia} / ${fo.treinos} (${pct(fo.psicologia,fo.treinos)})`]); rows.push(['Temas transversais',`${fo.temas} / ${fo.treinos} (${pct(fo.temas,fo.treinos)})`]);
          if(fo.engajamento) rows.push(['Engajamento muito alto',`${fo.engajamento['Muito alto']||0} / ${fo.treinos} (${pct(fo.engajamento['Muito alto']||0,fo.treinos)})`]); }
  let c=`<table class="ind">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
  if(!fo && t.tipo==='pt') c+=`<div class="nota az">O Primeiro Tempo não tem formulário de treinos: aparecem só os dados da lista de presença.</div>`;
  if(comNotas && t.interno){

}

  if(PUBLICO||!t.interno) return '';
  let c='';
  if(t.interno.alertas.length) c+=box(`${esc(t.nome)} — atletas abaixo de 75%`,`<div class="tw"><table class="t"><thead><tr><th>Atleta</th><th>Frequência</th><th>P</th><th>A</th><th>AJ</th></tr></thead><tbody>${t.interno.alertas.map(a=>`<tr><td>${esc(a.nome)}</td><td class="baixo">${f1(a.freq)}%</td><td>${a.P}</td><td>${a.A}</td><td>${a.AJ}</td></tr>`).join('')}</tbody></table></div>`);
  if(MODO_TURMA && t.interno.mov.length) c+=box(`${esc(t.nome)} — movimentação`,`<div class="tw"><table class="t"><thead><tr><th>Atleta</th><th>Tipo</th></tr></thead><tbody>${t.interno.mov.map(m=>`<tr><td>${esc(m.nome)}</td><td>${esc(m.tipo)}</td></tr>`).join('')}</tbody></table></div>`);
  return c;
}

/* ---------- abas ---------- */
const abas=[];
if (MODO_TURMA) {
  const t=PT[0];
  abas.push(['Minha turma', `<span class="pill">${esc(t.nome)} — ${periodo}</span>
    <p class="sub">Frequência oficial do programa no mês: ${f1(DADOS.ref_prog)}%.</p>
    <div class="grade">${cartaoTurma(t,true)}${t.freq&&t.serie.some(s=>s.freq!=null)?box('Frequência mês a mês',barras(t.serie.filter(s=>s.freq!=null).map(s=>[s.mes,s.freq,f1(s.freq)+'%']),{max:100,cor:corFreq})):''}</div>
    ${mesAMes(t)}${listaAtletas(t)}`]);
  if (t.form) abas.push(['Conteúdos', `<span class="pill">${esc(t.nome)} — o que foi trabalhado</span>${detalhesTurma(t)}`]);
} else {
  /* VISÃO GERAL */
  const treinos=T.geral.treinos+B.geral.treinos, psico=T.geral.psicologia+B.geral.psicologia, temas=T.geral.temas+B.geral.temas;
  const ult=E?E.serie[E.serie.length-1]:null;
  const turmasF=F?F.turmas.filter(t=>!t.pt):[];
  const formT=[...T.turmas,...B.turmas];
  const alertasGerais=[];
  if(F){ const b=turmasF.filter(t=>t.oficial<75); if(b.length) alertasGerais.push(['la',`Frequência abaixo de 75%: ${b.map(t=>`${curto(t.nome)} (${f1(t.oficial)}%)`).join(', ')}.`]); }
  if(E){ const b=E.turmas.filter(t=>!t.pt&&t.taxa>=10); if(b.length) alertasGerais.push(['la',`Evasão de 10% ou mais no mês: ${b.map(t=>`${curto(t.nome)} (${f1(t.taxa)}%)`).join(', ')}.`]); }
  const aus=[...T.ausencias,...B.ausencias].reduce((m,[k,v])=>(m[k]=(m[k]||0)+v,m),{});
  const topA=Object.entries(aus).sort((a,b)=>b[1]-a[1]).slice(0,4);
  if(topA.length) alertasGerais.push(['am',`Motivos de ausência mais frequentes: ${topA.map(([k,v])=>`${k.toLowerCase()} (${v}×)`).join(', ')}.`]);
  alertasGerais.push(['az',`Temas transversais: ${temas} registros em ${treinos} treinos (${pct(temas,treinos)}). Psicologia: ${psico} sessões (${pct(psico,treinos)}).`]);
  let g=`<span class="pill">Resumo geral — ${treinos} treinos · ${periodo}</span>
  <div class="kpis">
    ${F?kpi('Frequência oficial',f1(F.programa.oficial)+'%',`${F.programa.alertas} atletas abaixo de 75%`):''}
    ${F?kpi('Atletas ativas',F.programa.ativas,'no fim do mês'):''}
    ${ult?kpi('Evasão do mês',f1(ult.taxa)+'%',`${ult.saidas} saída${ult.saidas!==1?'s':''} · ${ult.entradas} entrada${ult.entradas!==1?'s':''}`):''}
    ${kpi('Total de treinos',treinos,`${T.geral.treinos} educadoras · ${B.geral.treinos} base`)}
    ${kpi('Sessões psicologia',psico,pct(psico,treinos)+' dos treinos')}
    ${kpi('Temas transversais',temas,pct(temas,treinos)+' dos treinos')}
  </div>`;
  if(!F) g+=`<div class="pend"><b>Aguardando a lista de presença do TOTVS.</b> Nenhum número de frequência foi estimado.</div>`;
  g+=`<div class="grade">
    ${F?box('Frequência oficial por turma',barras(turmasF.map(t=>[curto(t.nome),t.oficial,f1(t.oficial)+'%']),{max:100,cor:corFreq})+`<div class="leg"><span><i style="background:${AZ}"></i>85% ou mais</span><span><i style="background:${AM}"></i>75% a 85%</span><span><i style="background:${LA}"></i>abaixo de 75%</span></div>`):''}
    ${E?box('Evasão do mês por turma',barras(E.turmas.filter(t=>!t.pt).map(t=>[curto(t.nome),t.taxa,`${f1(t.taxa)}%`]),{cor:(n)=>n>=10?LA:(n>0?AM:CZ)})):''}
    ${box('Treinos por turma',barras(formT.map(t=>[curto(t.nome),t.treinos]).sort((a,b)=>b[1]-a[1]),{cor:corRank}))}
    ${box('Psicologia por turma — sessões realizadas',barras(formT.map(t=>[curto(t.nome),t.treinos?t.psicologia/t.treinos:0,`${t.psicologia} / ${t.treinos}`]).sort((a,b)=>b[1]-a[1]),{max:1,cor:(n)=>n>=.3?AZ:(n>=.15?AM:LA)}))}
  </div>`;
  if(E) g+=`<div class="grade">${box('Saídas por mês',barras(E.serie.map(s=>[MESES[s.mes-1],s.saidas]),{cor:LA}))}${box('Entradas por mês',barras(E.serie.map(s=>[MESES[s.mes-1],s.entradas]),{cor:AZ}))}</div>`;
  const MV=DADOS.motivos;
  if(MV&&MV.meses&&MV.meses.length){
    const mAt=MV.meses.find(x=>x.mes===DADOS.mes), ini=MESES[MV.desde-1].toLowerCase();
    const nAno=MV.ano.reduce((s,x)=>s+x[1],0);
    let mv=`<div class="grade">`;
    mv+=box(`Motivos das saídas — ${periodo}`, mAt&&mAt.motivos.length ? barras(mAt.motivos,{cor:LA})+(mAt.sem_motivo?`<p class="sub" style="margin:8px 0 0">${mAt.sem_motivo} saída(s) ainda sem motivo registrado.</p>`:'') : `<p class="sub" style="margin:0">${mAt&&mAt.saidas?'Motivos ainda não registrados pela coordenação.':'Sem saídas com motivo registrado no mês.'}</p>`);
    mv+=box(`Motivos das saídas — acumulado desde ${ini} (${nAno})`, barras(MV.ano,{cor:(n,i)=>i<2?LA:AM}));
    mv+=`</div>`;
    const ptN=MV.ano_pt.reduce((s,x)=>s+x[1],0);
    mv+=`<p class="sub">Motivos registrados pela coordenação e pelo serviço social na planilha interna de saídas, a partir de ${ini}/${DADOS.ano}. Só o programa (Sub-11 ao Sub-17)${ptN?`; o Primeiro Tempo teve ${ptN} saída(s) com motivo no período`:''}.${MV.ajuste?` ${MV.ajuste} registro(s) de ajuste de cadastro não contam como saída.`:''}${MV.sem_motivo?` ${MV.sem_motivo} saída(s) ainda sem motivo.`:''}</p>`;
    g+=mv;
  }
  g+=box('Alertas e pontos de atenção',alertasGerais.map(([c,x])=>`<div class="nota ${c}">${esc(x)}</div>`).join(''));
  if(E) g+=`<p class="sub">Evasão do mês = saídas ÷ atletas ativas no início do mês. No ano: ${E.ano.saidas} saídas e ${E.ano.entradas} entradas desde fevereiro (evasão acumulada de ${f1(E.ano.taxa)}%). Mudança de turma não conta como evasão. O Primeiro Tempo (BASF) fica fora dos totais do programa.</p>`;
  abas.push(['Visão geral',g]);

  /* POR TURMA */
  const linhas=PT.filter(t=>t.tipo!=='pt');
  let p=`<span class="pill">Comparativo por turma — ${periodo}</span>
  <div class="box"><h4>Indicadores do mês</h4><div class="tw"><table class="t"><thead><tr><th>Turma</th><th>Freq.</th><th>Ativas</th><th>&lt;75%</th><th>Evasão</th><th>Treinos</th><th>Atletas</th><th>Esforço</th><th>Psico</th><th>Temas</th></tr></thead><tbody>
  ${linhas.map(t=>`<tr><td>${esc(t.nome)}</td><td class="${t.freq&&t.freq.oficial<75?'baixo':''}">${t.freq?f1(t.freq.oficial)+'%':'—'}</td><td>${t.freq?t.freq.ativas:'—'}</td><td>${t.freq?t.freq.alertas:'—'}</td><td>${t.ev?f1(t.ev.taxa)+'%':'—'}</td><td>${t.form?t.form.treinos:'—'}</td><td>${t.form?f1(t.form.media_atletas):'—'}</td><td>${t.form?f1(t.form.esforco):'—'}</td><td>${t.form?pct(t.form.psicologia,t.form.treinos):'—'}</td><td>${t.form?t.form.temas:'—'}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="grade">
    ${box('Esforço médio por turma (escala 1–5)',barras(formT.map(t=>[curto(t.nome),t.esforco,f1(t.esforco)]),{max:5,cor:corRank}))}
    ${box('Média de atletas presentes por treino',barras(formT.map(t=>[curto(t.nome),t.media_atletas,f1(t.media_atletas)]),{cor:corRank}))}
  </div>`;
  abas.push(['Por turma',p]);

  /* CATEGORIAS */
  const cats=[['Sub-11',['Sub-11']],['Sub-13',['Sub-13 Manhã','Sub-13 Tarde','Sub-13 Treinamento (piloto)']],['Sub-15',['Sub-15 Aprendizagem','Sub-15 Treinamento']],['Sub-17',['Sub-17 Manhã','Sub-17 Tarde','Sub-17 Treinamento']],['Primeiro Tempo',['Primeiro Tempo']]];
  cats.forEach(([cat,nomes])=>{
    const ts=nomes.map(n=>PT.find(t=>t.nome===n)).filter(Boolean); if(!ts.length) return;
    let c=`<span class="pill">${cat} — ${ts.map(t=>t.nome.replace(cat,'').trim()||t.nome).join(' · ')}</span>`;
    if(cat==='Sub-15') c+=`<p class="sub">O piloto Sub-13 Treinamento treina com o Sub-15 Treinamento e está na mesma lista de presença.</p>`;
    c+=`<div class="grade">${ts.map(t=>cartaoTurma(t,!PUBLICO)).join('')}</div>`;
    ts.forEach(t=>{ c+=mesAMes(t)+detalhesTurma(t)+listaAtletas(t); });
    abas.push([cat,c]);
  });

  /* CONTEÚDOS */
  let ct=`<span class="pill">Conteúdos, metodologias e psicologia — ${periodo}</span>
  <h4 style="margin:4px 0 10px;color:var(--azul);font-size:13px;letter-spacing:.08em;text-transform:uppercase">Sub-11 ao Sub-17 (educadoras)</h4>
  <div class="grade">
    ${box('Conteúdos técnico-táticos',barras(T.conteudos,{cor:corRank,fmt:n=>n+'×'}))}
    ${box('Fundamentos técnicos',barras(T.fundamentos,{cor:corRank,fmt:n=>n+'×'}))}
    ${box('Trabalho físico-corporal',barras(T.fisico,{cor:corRank}))}
    ${box('Métodos de ensino e treinamento',barras(T.metodos,{cor:corRank,fmt:n=>n+'×'}))}
    ${box('Psicologia — temas trabalhados',barras(T.psico_temas,{cor:AZ,fmt:n=>n+'×'}))}
    ${box('Percepção de esforço — geral',barras(['5','4','3','2','1'].map(k=>[{5:'Muito alto (5)',4:'Alto (4)',3:'Moderado (3)',2:'Baixo (2)',1:'Muito baixo (1)'}[k],T.geral.esforco_dist[k]||0]),{cor:(n,i)=>[AZ,AZ,AM,LA,LA][i]}))}
  </div>
  <h4 style="margin:18px 0 10px;color:var(--azul);font-size:13px;letter-spacing:.08em;text-transform:uppercase">Categoria de Base</h4>
  <div class="grade">
    ${box('Engajamento das atletas',pilha(B.geral.engajamento,['Muito alto','Médio','Muito Baixo'],cE))}
    ${box('Qualidade de execução x planejado',pilha(B.geral.execucao,['Totalmente coerente','Parcialmente coerente','Distante do planejado'],cE))}
    ${box('Envolvimento da comissão técnica',pilha(B.geral.comissao,['Envolvimento altamente qualificado','Envolvimento adequado','Pouco envolvimento'],cE))}
    ${box('Objetivos técnico-táticos',barras(B.conteudos,{cor:corRank,fmt:n=>n+'×'}))}
    ${box('Conteúdos técnicos',barras(B.fundamentos,{cor:corRank,fmt:n=>n+'×'}))}
    ${box('Trabalho físico-corporal',barras(B.fisico,{cor:corRank}))}
    ${box('Abordagens metodológicas',barras(B.metodos,{cor:corRank,fmt:n=>n+'×'}))}
    ${B.temas_lista.length?box('Temas transversais e atividades',`<div class="tags">${B.temas_lista.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`):''}
  </div>`;
  abas.push(['Conteúdos',ct]);

  /* DESTAQUES */
  abas.push(['Destaques',`<span class="pill">Destaques do mês — ${periodo}</span>
  <div class="dest">${DADOS.destaques.map(x=>`<div class="box"><div class="dt">${esc(x.data)}</div><h5>${esc(x.titulo)}</h5><p>${esc(x.texto)}</p><div class="chips">${x.ind.map(i=>`<span>${i}</span>`).join('')}</div></div>`).join('')}</div>
  <p class="sub" style="margin-top:12px">IBP Bem-estar e Pertencimento · IPF Protagonismo Feminino · IDES Desenvolvimento Esportivo · IES Engajamento e Retenção · IEF Engajamento Familiar · IBI Bem-estar Integral</p>`]);

  /* ACOMPANHAMENTO (interno) */
  if(!PUBLICO){
    const regs=[...(T.interno?.saidas||[]).map(x=>['Saída · educadoras',x]),...(B.interno?.saidas||[]).map(x=>['Saída · Base',x]),...(T.interno?.observacoes||[]).map(x=>['Observação · educadoras',x]),...(B.interno?.observacoes||[]).map(x=>['Observação · Base',x])];
    let a=`<span class="pill">Acompanhamento — uso interno</span>`;
    if(F&&F.interno) a+=box(`Atletas ativas abaixo de 75% (${F.interno.alertas.length})`,`<div class="tw"><table class="t"><thead><tr><th>Atleta</th><th>Turma</th><th>Frequência</th><th>P</th><th>A</th><th>AJ</th></tr></thead><tbody>${F.interno.alertas.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.turma)}</td><td class="baixo">${f1(x.freq)}%</td><td>${x.P}</td><td>${x.A}</td><td>${x.AJ}</td></tr>`).join('')}</tbody></table></div>`);
    if(E&&E.interno) a+=box('Movimentação do mês',`<div class="tw"><table class="t"><thead><tr><th>Atleta</th><th>Turma</th><th>Tipo</th></tr></thead><tbody>${E.interno.movimentacao.map(m=>`<tr><td>${esc(m.nome)}</td><td>${esc(m.turma)}</td><td>${esc(m.tipo)}</td></tr>`).join('')}</tbody></table></div>`);
    a+=box('Registros das equipes nos formulários',regs.length?regs.map(([k,v])=>`<div class="nota am"><b>${k}:</b> ${esc(v)}</div>`).join(''):'<p class="sub" style="margin:0">Nenhum registro no mês.</p>');
    abas.push(['Acompanhamento',a]);
  }
}

/* ---------- montar ---------- */
document.getElementById('abas').innerHTML=abas.map(([n],i)=>`<button type="button" role="tab" aria-selected="${i===0}" data-i="${i}">${n}</button>`).join('');
document.getElementById('conteudo').innerHTML=abas.map(([,c],i)=>`<section class="aba" data-i="${i}" ${i?'hidden':''}>${c}</section>`).join('');
document.querySelectorAll('#abas button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#abas button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.aba').forEach(s=>s.hidden=s.dataset.i!==b.dataset.i);
  window.scrollTo({top:0});
}));
if(MODO_TURMA){
  document.getElementById('big').textContent=PT[0].nome;
  document.getElementById('lbl').textContent='Devolutiva da turma · '+periodo;
}else{
  document.getElementById('big').textContent=periodo;
  document.getElementById('lbl').textContent='Fechamento do mês · '+(PUBLICO?'versão pública':'uso interno');
}
if(!PUBLICO) document.getElementById('aviso').innerHTML=`<div class="aviso">${MODO_TURMA?'Documento da equipe com dados das atletas. Não encaminhar nem publicar.':'Uso interno da equipe. Não publicar no GitHub nem encaminhar fora da equipe.'}</div>`;
document.getElementById('rodape').textContent=`Meninas em Campo · ${MODO_TURMA?'Devolutiva '+PT[0].nome:'Fechamento'} · ${periodo}${PUBLICO?' · dados agregados, sem nomes':''}`;
</script>
</body>
</html>
