*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#354d73;--azul-2:#2b3f5f;--amarelo:#f3ce02;--laranja:#f34b06;--verde:#42ce02;--roxo:#8010ff;
  --fundo:#f1eee8;--papel:#fff;--linha:#e3e0d8;--texto:#22344f;--texto-2:#5b6780;--cinza:#d9d4ca;
  --display:'Pressio MEC','Pressio No. 45','Barlow Condensed','Arial Narrow',sans-serif;--corpo:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{font-family:var(--corpo);background:var(--fundo);color:var(--texto);font-size:15px;line-height:1.45}
.topo{background:var(--amarelo);border-bottom:6px solid var(--azul);padding:22px 28px}
.topo-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:900;font-size:34px;line-height:.82;color:var(--azul);text-transform:uppercase}
.topo-dir{text-align:right}
.topo-dir .big{font-family:var(--display);font-weight:900;font-size:clamp(40px,7vw,64px);line-height:.9;color:var(--azul);text-transform:uppercase}
.topo-dir .lbl{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--azul-2);text-transform:uppercase;opacity:.85}
.aviso{background:var(--laranja);color:#fff;text-align:center;font-weight:700;font-size:13.5px;padding:7px 12px;letter-spacing:.02em}
main{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
.abas{display:flex;flex-wrap:wrap;border:2px solid var(--azul);border-radius:10px;overflow:hidden;background:#fff;margin-bottom:22px}
.abas button{flex:1 1 auto;font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--azul);background:#fff;border:none;border-right:1px solid var(--linha);padding:13px 14px;cursor:pointer;white-space:nowrap}
.abas button:last-child{border-right:none}
.abas button[aria-selected="true"]{background:var(--azul);color:var(--amarelo)}
.aba[hidden]{display:none}
.pill{display:inline-block;background:var(--amarelo);color:var(--azul);font-weight:800;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:6px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--azul);border-radius:10px;padding:14px 12px;text-align:center;color:#fff}
.kpi .l{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amarelo)}
.kpi .v{font-family:var(--display);font-weight:900;font-size:44px;line-height:1.05;margin:4px 0 2px}
.kpi .d{font-size:12px;color:#c9d3e3}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin-bottom:16px}
@media (max-width:520px){.grade{grid-template-columns:1fr}}
.box{background:var(--papel);border:2px solid var(--azul);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.grade .box{margin-bottom:0}
.box h4{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);padding-bottom:8px;border-bottom:3px solid var(--amarelo);margin-bottom:12px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 56px;align-items:center;gap:10px;font-size:12.5px;margin-bottom:7px}
.bar .t{text-align:right;text-transform:uppercase;color:var(--azul);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{height:13px;background:#ecebe6;border-radius:3px;overflow:hidden}
.bar .b i{display:block;height:100%;border-radius:3px}
.bar .n{font-weight:800;color:var(--azul)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--texto-2);margin-top:6px}
.leg i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.pilha{display:flex;height:28px;border-radius:5px;overflow:hidden}
.pilha span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;min-width:0;overflow:hidden}
.ind{width:100%;border-collapse:collapse;font-size:14px}
.ind td{padding:7px 2px;border-bottom:1px solid var(--linha)}
.ind td:last-child{text-align:right;font-weight:800;font-size:15.5px}
.nota{border-radius:6px;padding:10px 14px;font-size:13.5px;margin-top:10px;border-left:5px solid}
.nota.az{background:#e6ecf5;border-color:var(--azul);color:var(--azul)}
.nota.am{background:#fdf6d3;border-color:var(--amarelo);color:#5f5000}
.nota.la{background:#fde9e1;border-color:var(--laranja);color:#8a2a00}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-2);text-align:right;padding:7px 8px;border-bottom:2px solid var(--amarelo);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--linha);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tfoot td{font-weight:800}
.baixo{color:var(--laranja);font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#fdf6d3;color:var(--azul);font-size:13px;padding:4px 10px;border-radius:4px}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dest .box h5{font-family:var(--display);font-size:22px;line-height:1.05;margin:4px 0 6px;font-weight:800}
.dest .dt{font-size:12px;font-weight:800;color:var(--laranja);text-transform:uppercase;letter-spacing:.05em}
.dest p{font-size:13.5px;color:var(--texto-2)}
.chips{display:flex;gap:4px;margin-top:8px}.chips span{font-size:11px;font-weight:800;background:var(--azul);color:var(--amarelo);padding:2px 7px;border-radius:3px}
.pend{background:#fdf6d3;border:2px dashed var(--amarelo);border-radius:10px;padding:14px 16px}
.sub{color:var(--texto-2);font-size:13.5px;margin:-6px 0 14px}
footer{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a09a8e;padding:20px}
@media print{.abas{display:none}.aba[hidden]{display:block}.aba{break-before:page}}

:root{--c1:#9db0cf;--c2:#354d73;--c3:#8010ff}
.db{display:grid;grid-template-columns:minmax(110px,22%) 1fr 150px;align-items:center;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--linha)}
.db:last-of-type{border-bottom:none}
.db .t{font-weight:800;color:var(--azul)}.db .t small{display:block;font-weight:500;color:var(--texto-2);font-size:11.5px;line-height:1.25}
.db .v{font-weight:800;color:var(--azul);text-align:right;font-size:13px}.db .v small{display:block;font-weight:600;font-size:11.5px;color:var(--texto-2)}
.trilho{position:relative;height:26px}
.trilho .eixo{position:absolute;left:0;right:0;top:12px;height:2px;background:#ecebe6;border-radius:2px}
.trilho .meta{position:absolute;top:2px;bottom:2px;width:0;border-left:2px dashed var(--laranja)}
.trilho .seg{position:absolute;top:12px;height:2px;background:var(--c2);opacity:.45}
.trilho .pt{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);cursor:default}
.escala{display:grid;grid-template-columns:minmax(110px,22%) 1fr 150px;gap:12px;font-size:11px;color:var(--texto-2)}
.escala .r{position:relative;height:14px}.escala .r span{position:absolute;transform:translateX(-50%)}
.colunas{display:flex;align-items:flex-end;gap:10px;height:200px;position:relative;padding-top:18px;margin:0 4px}
.colunas .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;z-index:1}
.colunas .c i{display:block;width:100%;max-width:46px;border-radius:4px 4px 0 0}
.colunas .c b{font-size:12px;color:var(--azul);margin-bottom:4px}
.colunas .ref{position:absolute;left:0;right:0;border-top:2px dashed var(--laranja);z-index:2}
.colunas .ref span{position:absolute;left:0;top:-18px;font-size:11px;font-weight:800;color:#8a2a00;background:#fff;padding:0 4px}
.rot{display:flex;gap:10px;margin:6px 4px 0}.rot span{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--texto-2);text-transform:uppercase}
.bar .b{position:relative;overflow:visible}.bar .b .mk{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--laranja)}
.st{font-weight:700;white-space:nowrap}
table.t td.l{white-space:normal;text-align:left;min-width:180px}
#tip{position:fixed;pointer-events:none;background:var(--azul);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .1s;z-index:10;max-width:260px}
.kpi .v small{font-size:22px}
table.t.comp td{white-space:normal;vertical-align:top}table.t.comp td:nth-child(3){min-width:120px}
@media (max-width:640px){
 .db{grid-template-columns:1fr auto;grid-template-areas:"t v" "r r";row-gap:4px}
 .db .t{grid-area:t}.db .v{grid-area:v}.db .trilho{grid-area:r}
 .escala{grid-template-columns:1fr}.escala>span{display:none}
}
</style>
</head>
<body>
<header class="topo"><div class="topo-in">
  <div class="logo">Meninas<br>em Campo</div>
  <div class="topo-dir"><div class="big">Impacto 2026</div><div class="lbl" id="lbl"></div></div>
</div></header>
<main><nav class="abas" role="tablist" id="abas"></nav><div id="conteudo"></div></main>
<footer id="rodape"></footer>
<div id="tip" role="tooltip"></div>
<script>
const D={"ciclos": [{"n": 217, "ind": {"IBP": 4.39, "IPF": 3.7, "IDES": 4.48, "IES": 4.08, "ICE": 4.54, "IEF": 4.57, "IBI": 4.27}, "media": 4.29}, {"n": 136, "ind": {"IBP": 4.38, "IPF": 3.76, "IDES": 4.45, "IES": 4.37, "ICE": 4.49, "IEF": 4.56, "IBI": 4.22}, "media": 4.32}, null], "ks": ["IBP", "IPF", "IDES", "IES", "ICE", "IEF", "IBI"], "desc": {"IBP": "Bem-estar, pertencimento e segurança", "IPF": "Protagonismo e liderança", "IDES": "Desenvolvimento esportivo", "IES": "Engajamento e frequência", "ICE": "Educação e projeto de vida", "IEF": "Apoio e engajamento familiar", "IBI": "Saúde e bem-estar físico"}, "metas_ciclo": {"IBP": [null, 4.2, 4.4], "IPF": [null, 3.7, 4.0], "IDES": [null, 4.1, 4.2], "IES": [null, 4.2, 4.3], "ICE": [null, 4.6, 4.7], "IEF": [null, 4.6, 4.7], "IBI": [null, 4.35, 4.5]}, "meta_lie": 4.0, "freq": [["Fev", 85.8], ["Mar", 86.8], ["Abr", 87.6], ["Mai", 89.1], ["Jun", 85.7], ["Jul", 93.5], ["Ago", 90.1], ["Set", 91.1]], "m1": [["Sub-11", 23, 10, 43.5], ["Sub-13 Manhã", 16, 11, 68.8], ["Sub-13 Tarde", 25, 16, 64.0], ["Sub-15 Aprendizagem", 24, 24, 100.0], ["Sub-15 Treinamento", 44, 25, 56.8], ["Sub-17 Manhã", 11, 3, 27.3], ["Sub-17 Tarde", 29, 9, 31.0], ["Sub-17 Treinamento", 21, 6, 28.6]], "meta1": 52.5, "grupos": [["Sub-11", 30, 15, 50.0, 46.7], ["Sub-13", 56, 36, 64.3, 30.4], ["Sub-15", 50, 38, 76.0, 78.0], ["Sub-17 Aprendizagem", 43, 13, 30.2, 60.5], ["Sub-17 Treinamento", 20, 5, 25.0, 60.0]], "perm": {"fev": 205, "ent": 72, "sai": 74, "perm": 73.3, "meta": 70, "lbl": "Entradas no ano (fev–set)"}, "inv": 1083634.43, "inv_lbl": "Investimento Total LIE até set/2026 (R$)", "comp": [["M1", "Nº de beneficiárias atendidas", "≥ 40", "206 (mai) ✅", "204 (set) ✅", "—", "✅ ATINGIDA"], ["M3", "Frequência mínima nos treinos", "≥ 70% (meta oficial: frequência do programa, aba 6)", "84,0% (mai) ✅", "86,3% (set) ✅", "—", "✅ ATINGIDA"], ["M4", "Evolução técnica esportiva", "≥ 70% (meta oficial na aba 6)", "Linha de base (fev–mar)", "54%", "—", "🔶 EM CURSO — 3ª aplicação em dez"], ["M5", "Participação familiar", "≥ 50-60%", "4,57", "4,56", "—", "✅ ATINGIDA"], ["M6", "Redução de evasão esportiva", "≥ 30%", "Em monit.", "Evasão acumulada 2026: 26,7%", "—", "⏳ MONIT. — falta base 2025"], ["M7", "Desempenho escolar (sem reprovação)", "≥ 70%", "4,54", "4,49", "—", "✅ ATINGIDA"], ["M8", "Protagonismo e liderança", "≥ 4,0", "3,70", "3,76", "—", "🔶 PRÓXIMO"], ["M9", "Relatório de impacto publicado", "1 relatório", "Em andamento", "—", "Dez 2026", "⏳ PRAZO"]], "fonte": "MEC_Painel_Longitudinal_v6.xlsx", "data": "07/10/2026"};
const f2=v=>v==null?'—':v.toFixed(2).replace('.',','), f1=v=>v==null?'—':String(v).replace('.',','), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kpi=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;
const box=(t,c)=>`<div class="box"><h4>${t}</h4>${c}</div>`;
const CN=['Ciclo 1 (abr)','Ciclo 2 (set)','Ciclo 3 (dez)'], CC=['var(--c1)','var(--c2)','var(--c3)'];
const real=D.ciclos.map((c,i)=>c?i:null).filter(i=>i!==null), ult=D.ciclos[real[real.length-1]], ant=real.length>1?D.ciclos[real[real.length-2]]:null;
const naMeta=D.ks.filter(k=>ult.ind[k]>=D.meta_lie).length;
const abaixo=D.ks.filter(k=>ult.ind[k]<D.meta_lie);
const LO=3, HI=5, X=v=>((v-LO)/(HI-LO)*100).toFixed(2)+'%';
const abas=[];

/* VISÃO GERAL */
const minF=D.freq.length?Math.min(...D.freq.map(x=>x[1])):null;
let g=`<span class="pill">Visão geral — ${CN[real[real.length-1]]} · atualizado em ${D.data}</span>
<div class="kpis">
 ${kpi('Autoavaliação — média',f2(ult.media),ant?`${ult.media>=ant.media?'+':''}${f2(ult.media-ant.media)} vs ciclo anterior · meta ${f2(D.meta_lie)}`:`meta ${f2(D.meta_lie)}`)}
 ${kpi('Indicadores na meta',`${naMeta}<small> / 7</small>`,abaixo.length?`abaixo: ${abaixo.join(', ')}`:'todos acima de '+f2(D.meta_lie))}
 ${kpi('Meta 1 — evolução técnica',D.meta1!=null?Math.round(D.meta1)+'%':'—','média das turmas · meta 70%')}
 ${kpi('Meta 2 — frequência',minF!=null?f1(minF)+'%':'—','menor mês do ano · meta 70%')}
 ${kpi('Permanência no ano',f1(D.perm.perm)+'%','meta interna '+D.perm.meta+'%')}
 ${kpi('Respostas',ult.n,real.map(i=>`C${i+1}: ${D.ciclos[i].n}`).join(' · '))}
</div>`;
const pts=[];
if(abaixo.length) pts.push(['la',`${abaixo.map(k=>`${k} (${f2(ult.ind[k])})`).join(', ')} abaixo da meta de ${f2(D.meta_lie)} na autoavaliação.`]);
if(D.meta1!=null&&D.meta1<70) pts.push(['am',`Meta 1 (evolução técnica): ${Math.round(D.meta1)}% na média das turmas, contra 70%. ${D.m1.filter(x=>x[3]<70).length} de ${D.m1.length} turmas abaixo. Em curso até a 3ª aplicação do scout (dez).`]);
if(ant){const up=D.ks.map(k=>[k,ult.ind[k]-ant.ind[k]]).sort((a,b)=>b[1]-a[1]); if(up[0][1]>0.05) pts.push(['az',`Maior avanço: ${up[0][0]} (+${f2(up[0][1])}).`]);}
if(minF!=null&&minF>=70) pts.push(['az',`Meta 2 (frequência ≥ 70%) atingida em todos os ${D.freq.length} meses.`]);
if(D.perm.perm>=D.perm.meta) pts.push(['az',`Permanência de ${f1(D.perm.perm)}% acima da meta interna de ${D.perm.meta}%.`]);
g+=box('Leitura rápida',pts.map(([c,x])=>`<div class="nota ${c}">${esc(x)}</div>`).join(''));
abas.push(['Visão geral',g]);

/* AUTOAVALIAÇÃO */
let au=`<span class="pill">Autoavaliação das meninas — escala 1 a 5</span>`;
let rows='';
D.ks.forEach(k=>{
  const vs=real.map(i=>D.ciclos[i].ind[k]); const lo=Math.min(...vs), hi=Math.max(...vs);
  let tr=`<div class="eixo"></div><div class="meta" style="left:${X(D.meta_lie)}"></div>`;
  if(vs.length>1) tr+=`<div class="seg" style="left:${X(lo)};width:calc(${X(hi)} - ${X(lo)})"></div>`;
  real.forEach(i=>{const v=D.ciclos[i].ind[k]; tr+=`<span class="pt" style="left:${X(v)};background:${CC[i]}" data-tip="${k} · ${CN[i]}: ${f2(v)}${v<D.meta_lie?' (abaixo da meta)':''}"></span>`;});
  const dv=ant?ult.ind[k]-ant.ind[k]:null;
  rows+=`<div class="db"><div class="t">${k}<small>${esc(D.desc[k]||'')}</small></div><div class="trilho">${tr}</div>
   <div class="v">${f2(ult.ind[k])}${ult.ind[k]<D.meta_lie?' <span class="baixo">⚠</span>':' ✓'}<small>${dv!=null?(dv>=0?'+':'')+f2(dv)+' vs ciclo anterior':''}</small></div></div>`;
});
const esc_=[3,3.5,4,4.5,5].map(v=>`<span style="left:${X(v)}">${f1(v.toFixed(1))}</span>`).join('');
au+=box('Indicadores por ciclo',`${rows}<div class="escala"><span></span><div class="r">${esc_}</div><span></span></div>
 <div class="leg">${real.map(i=>`<span><i style="background:${CC[i]};border-radius:50%"></i>${CN[i]} — ${D.ciclos[i].n} respostas</span>`).join('')}<span><i style="background:none;border-left:2px dashed var(--laranja);border-radius:0;width:4px"></i>Meta LIE ${f2(D.meta_lie)}</span></div>`);
au+=box('Tabela',`<div class="tw"><table class="t"><thead><tr><th>Indicador</th>${real.map(i=>`<th>${CN[i]}</th>`).join('')}${ant?'<th>Variação</th>':''}<th>Meta LIE</th><th>${real.length<3?'Meta '+CN[real.length]:''}</th></tr></thead><tbody>
 ${D.ks.map(k=>`<tr><td>${k} — ${esc(D.desc[k]||'')}</td>${real.map(i=>`<td class="${D.ciclos[i].ind[k]<D.meta_lie?'baixo':''}">${f2(D.ciclos[i].ind[k])}</td>`).join('')}${ant?`<td>${(ult.ind[k]-ant.ind[k]>=0?'+':'')+f2(ult.ind[k]-ant.ind[k])}</td>`:''}<td>${f2(D.meta_lie)}</td><td>${f2((D.metas_ciclo[k]||[])[real.length])}</td></tr>`).join('')}
 <tr><td><b>Média geral</b></td>${real.map(i=>`<td><b>${f2(D.ciclos[i].media)}</b></td>`).join('')}${ant?`<td><b>${(ult.media-ant.media>=0?'+':'')+f2(ult.media-ant.media)}</b></td>`:''}<td>${f2(D.meta_lie)}</td><td></td></tr>
 </tbody></table></div>`);
au+=`<p class="sub" style="margin-top:4px">Respostas convertidas para 1–5 (método fixo nos 3 ciclos). Indicador do ciclo = média das respostas. IBP Bem-estar e pertencimento · IPF Protagonismo · IDES Desenvolvimento esportivo · IES Engajamento · ICE Educação e projeto de vida · IEF Família · IBI Saúde e bem-estar.</p>`;
abas.push(['Autoavaliação',au]);

/* METAS LIE */
let ml=`<span class="pill">Metas quantitativas da LIE</span><div class="grade">`;
const cor=v=>v>=70?'var(--azul)':'var(--laranja)';
ml+=box(`Meta 1 — evolução técnica por turma (média ${D.meta1!=null?Math.round(D.meta1)+'%':'—'})`,
  D.m1.map(([t,n,s,p])=>`<div class="bar" data-tip="${esc(t)}: ${s} de ${n} meninas subiram ≥1 nível (${f1(p)}%)"><span class="t" title="${esc(t)}">${esc(t)}</span><span class="b"><i style="width:${p}%;background:${cor(p)}"></i><span class="mk" style="left:70%"></span></span><span class="n">${Math.round(p)}%</span></div>`).join('')+
  `<div class="leg"><span><i style="background:var(--azul)"></i>70% ou mais</span><span><i style="background:var(--laranja)"></i>abaixo de 70%</span><span><i style="background:none;border-left:2px dashed var(--laranja);border-radius:0;width:4px"></i>meta 70%</span></div>
  <p class="sub" style="margin:8px 0 0">% de meninas que subiram ao menos um nível em ao menos um fundamento entre a 1ª (fev–mar) e a 2ª aplicação (jul) do scout.</p>`);
ml+=box('Meta 2 — frequência oficial do programa por mês',
  `<div class="colunas"><div class="ref" style="bottom:${70}%"><span>meta 70%</span></div>${D.freq.map(([m,v])=>`<div class="c" data-tip="${m}: ${f1(v)}%"><b>${Math.round(v)}%</b><i style="height:${v}%;background:${cor(v)}"></i></div>`).join('')}</div>
   <div class="rot">${D.freq.map(([m])=>`<span>${m}</span>`).join('')}</div>
   <p class="sub" style="margin:10px 0 0">Frequência oficial = (presenças + faltas justificadas) ÷ total de marcações, TOTVS. Sub-11 ao Sub-17.</p>`);
ml+=`</div>`;
ml+=box('Scout por grupo — 1ª → 2ª aplicação',`<div class="tw"><table class="t"><thead><tr><th>Grupo</th><th>Meninas pareadas</th><th>Subiram ≥1 nível</th><th>%</th><th>Realizam ≥ "às vezes" na maioria</th></tr></thead><tbody>
 ${D.grupos.map(([g,n,s,p,q])=>`<tr><td>${esc(g)}</td><td>${n}</td><td>${s}</td><td class="${p<70?'baixo':''}">${Math.round(p)}%</td><td>${Math.round(q)}%</td></tr>`).join('')}</tbody></table></div>`);
abas.push(['Metas LIE',ml]);

/* COMPLEMENTARES */
let co=`<span class="pill">Indicadores complementares e metas internas</span>
<div class="kpis">${kpi('Permanência no ano',f1(D.perm.perm)+'%',`meta interna ${D.perm.meta}%`)}${kpi('Ativas em fevereiro',D.perm.fev,'base do ano')}${kpi('Entradas no ano',D.perm.ent,'')}${kpi('Saídas no ano',D.perm.sai,'')}${D.inv?kpi('Investimento LIE',`R$ ${(D.inv/1e6).toFixed(2).replace('.',',')} mi`,esc((D.inv_lbl||'').replace('Investimento Total LIE ','').replace(' (R$)',''))):''}</div>`;
co+=box('Plano de Trabalho — metas complementares',`<div class="tw"><table class="t comp"><thead><tr><th>#</th><th>Indicador</th><th>Meta anual</th><th>Ciclo 1</th><th>Ciclo 2</th><th>Ciclo 3</th><th>Status</th></tr></thead><tbody>
 ${D.comp.map(r=>`<tr><td>${esc(r[0])}</td><td class="l">${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(r[5])}</td><td class="st">${esc(r[6])}</td></tr>`).join('')}</tbody></table></div>`);
co+=`<p class="sub" style="margin-top:4px">Permanência = 1 − saídas ÷ (ativas em fevereiro + entradas no ano). O SROI é calculado em dezembro, com os 3 ciclos.</p>`;
abas.push(['Complementares',co]);

/* montar */
document.getElementById('abas').innerHTML=abas.map(([n],i)=>`<button type="button" role="tab" aria-selected="${i===0}" data-i="${i}">${n}</button>`).join('');
document.getElementById('conteudo').innerHTML=abas.map(([,c],i)=>`<section class="aba" data-i="${i}" ${i?'hidden':''}>${c}</section>`).join('');
document.querySelectorAll('.abas button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.abas button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('.aba').forEach(s=>s.hidden=s.dataset.i!==b.dataset.i);});
document.getElementById('lbl').textContent='Painel longitudinal · dados agregados';
document.getElementById('rodape').textContent=`Meninas em Campo · Painel de Impacto 2026 · fonte: ${D.fonte} · dados agregados, sem nomes`;
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-tip]'); if(!el){tip.style.opacity=0;return;}
  tip.textContent=el.dataset.tip; tip.style.opacity=1; const w=tip.offsetWidth; tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px'; tip.style.top=(e.clientY+14)+'px';});
</script>
</body>
</html>
